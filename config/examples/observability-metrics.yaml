profile: full
# ANI 站点配置示例 —— 第二批 C2（累计：第一批四项 + 指标栈，不启用日志）
#
# 累计启用：certManager、postgresql、valkey、nats（第一批）+ metrics（本批指标栈）。
# 日志保持关闭：logging.backend=none，因此不部署 Fluent Bit 或任一日志后端。
# 默认 storageClass 为现有 Ceph RBD ani-block；本轮不引入新的 StorageClass。
#
# metrics 自 C2 起可真实部署（role + 校验脚本已随包发布）。
# loki/opensearch/fluent-bit 仍未实现，启用会在部署前明确失败。

name: ani-lab
installerNode: node1
ssh:
  user: ubuntu
  port: 22
  password: CHANGE_ME
nodes:
  - name: node1
    address: 172.16.101.20
  - name: node2
    address: 172.16.101.21
  - name: node3
    address: 172.16.101.22
network:
  stack: kcn
  managementInterface: ens34
  podCIDR: 10.16.0.0/16
  serviceCIDR: 10.96.0.0/16
  kcn:
    managedDevices: [ens35]
    encapNetworks: [172.16.101.0/24]
    intranetNetworks: [172.16.101.0/24, 10.96.0.0/16]
registry:
  port: 5000

# R05/A02: 存储必须显式声明，profile: full 不再隐含 Ceph。
# 三台节点各自的设备写成本节点的 /dev/disk/by-id/... 身份（不要用 /dev/sdb 这类
# 会变的裸名字，部署前用 lsblk -o NAME,PATH,TYPE,SERIAL,WWN 确认）。
# 未填写前预检会在拿到磁盘之前就失败，不会去扫盘或清盘。
storage:
  enabled: true
  provider: ceph
  makeDefaultStorageClass: true
  nodes:
    - {name: node1, devices: [/dev/disk/by-id/REPLACE_WITH_NODE1_DATA_DEVICE]}
    - {name: node2, devices: [/dev/disk/by-id/REPLACE_WITH_NODE2_DATA_DEVICE]}
    - {name: node3, devices: [/dev/disk/by-id/REPLACE_WITH_NODE3_DATA_DEVICE]}

components:
  certManager:
    enabled: true
  postgresql:
    enabled: true
    storageClass: ani-block
    storageSize: 10Gi
  valkey:
    enabled: true
    storageClass: ani-block
    storageSize: 2Gi
  nats:
    enabled: true
    storageClass: ani-block
    storageSize: 5Gi
  metrics:
    enabled: true
    storageClass: ani-block
    prometheusStorageSize: 5Gi
    alertmanagerStorageSize: 1Gi
    prometheusRetention: 24h
    # 必须小于 prometheusStorageSize，否则卷会先被写满、时长保留永远不生效。
    # Prometheus Operator CRD 只接受带尾部 B 的字节量纲（4GiB 合法，4Gi 会被 CRD 拒收）。
    prometheusRetentionSize: 4GiB
  logging:
    backend: none
