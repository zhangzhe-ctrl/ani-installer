name: ANI check

# The single code gate for this repository.
#
# It runs exactly the script that a local developer and scripts/build-code.sh
# run (kubekey/scripts/check-code.sh), so there is one gate implementation and
# CI cannot drift from a local run. The gate's one network step — preparing the
# locked chart material a clean checkout does not carry — is inside that script,
# so CI prepares it with the same code path as a local run and no test fetches
# anything.
#
# Deliberately NOT restricted to the upstream repository: every workflow under
# kubekey/.github/workflows is guarded by a repository-equality condition, which
# is why none of them ever ran for this fork. No job or step here carries such a
# guard.
on:
  push:
    paths: &gate-paths
      - 'kubekey/pkg/**'
      - 'kubekey/cmd/**'
      - 'kubekey/builtin/**'
      - 'kubekey/ani/**'
      - 'kubekey/scripts/**'
      - 'kubekey/hack/**'
      - 'kubekey/go.mod'
      - 'kubekey/go.sum'
      - 'kubekey/Makefile'
      # The lab tree (blueprint §4) is source too: its scripts run against the
      # same roles and must not be able to land unchecked.
      - 'kubekey/lab/**'
      - 'docs/execution/**'
      # The experiment harness at the repository root drives the same roles and
      # the same artifact; a change to it or to the declared lab topology must
      # not be able to land unchecked (F10: these paths used to be missing).
      - 'run_on_node.sh'
      - 'restore_esxi_snapshots.sh'
      - 'config/**'
      - '.github/workflows/ani-check.yaml'
  pull_request:
    # The same anchor list: a gate that triggers on push but not on a pull
    # request (or the other way round) leaves one of the two paths unchecked.
    paths: *gate-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-code:
    name: check-code.sh
    runs-on: ubuntu-24.04
    defaults:
      run:
        # The Go module lives in kubekey/, not at the repository root.
        working-directory: kubekey
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The R02 control test materialises the pre-R02 script from a pinned
          # historical commit; a shallow clone would not carry it.
          fetch-depth: 0

      - name: Restore the locked chart cache
        # C10: the gate reads real chart archives that are gitignored, so a clean
        # checkout has none. The cache is keyed on the approved lock itself — a
        # lock change means new digests and a forced re-fetch — and the
        # preparation step inside the gate re-verifies every cached file's sha256
        # before it adopts it, so a cache hit is never trusted on its own.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ani-installer-charts
          key: ani-charts-${{ hashFiles('kubekey/ani/components.lock.yaml') }}
          restore-keys: |
            ani-charts-

      - name: Install the Go toolchain required by go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: kubekey/go.mod
          cache-dependency-path: kubekey/go.sum

      - name: Run the code gate
        env:
          # Fail instead of downloading another toolchain: the gate must test the
          # toolchain the environment actually provides.
          GOTOOLCHAIN: local
        run: bash scripts/check-code.sh
