---
- hosts:
    - all
  gather_facts: true
  roles:
    - native/root

- import_playbook: hook/pre_install.yaml

# Load default variables and perform prechecks on all hosts
- hosts:
    - all
  gather_facts: true
  roles:
    - defaults
    - precheck

# Download all required software and generate certificates on the localhost
- hosts:
    - localhost
  roles:
    - certs/init
    - download

# Initialize all nodes and install necessary software packages
- hosts:
    - etcd
    - k8s_cluster
    - image_registry
    - nfs
  roles:
    - native

# Install the etcd cluster
- hosts:
    - etcd
  roles:
    - role: etcd/prepare
      when: .etcd.deployment_type | eq "external"
    - role: etcd/install
      when: .etcd.deployment_type | eq "external"


# Install the private image registry
- hosts:
    - image_registry
  roles:
    - cri/docker
    - image-registry
- hosts:
    - localhost
  roles:
    - role: image-registry/push
      when: 
        - .groups.image_registry | empty | not
        - .image_registry.type | empty | not

# Install the Kubernetes cluster
- hosts:
    - k8s_cluster
  gather_facts: true
  roles:
    - cri
    - kubernetes/pre-kubernetes
    - kubernetes/init-kubernetes
    - role: kubernetes/join-kubernetes
      when: 
        - .init_kubernetes_node | ne .inventory_hostname 
        - .kubernetes_install_LoadState.stdout | eq "not-found"    
    - role: kubernetes/certs
      when: 
        - .kubernetes.certs.renew
        - .groups.kube_control_plane | default list | has .inventory_hostname
  post_tasks:
    - name: ANI Runtime | Verify fixed containerd and runc versions
      loop: "{{ .groups.k8s_cluster | default list | toJson }}"
      delegate_to: "{{ .item }}"
      command: >-
        sh -ec 'containerd --version && runc --version
        && containerd --version | grep -F "v2.3.4"
        && runc --version | grep -F "1.4.3"'
    - name: Add custom labels to the cluster nodes
      delegate_to: "{{ .init_kubernetes_node }}"
      command: >-
        /usr/local/bin/kubectl label --overwrite node {{ $.hostname }}
        {{- range $k, $v := .kubernetes.custom_labels }} {{ $k }}={{ $v }}{{- end }}
      when: .kubernetes.custom_labels | empty | not
    - name: Add custom taint to the cluster nodes
      delegate_to: "{{ .init_kubernetes_node }}"
      when: .kubernetes.custom_taints | default list | empty | not
      command: >-
        /usr/local/bin/kubectl taint --overwrite nodes {{ $.hostname }}
        {{- range .kubernetes.custom_taints }} {{ . }}{{- end }}

# Install Kubernetes cluster software components (CNI and storage class) on the first control plane node
- hosts:
    - kube_control_plane[0]
  roles:
    - cni
    - ani/kcn
    - ani/envoy
    - ani/smoke
    - storageclass
    - ani/ceph
    # Foundation components follow the storage classes in the documented order:
    # cert-manager -> postgresql -> valkey -> nats. Each role is skipped
    # completely when its switch is off.
    - role: ani/cert-manager
      when: '{{ (index .ani.components "cert-manager").enabled }}'
    - role: ani/postgresql
      when: '{{ (index .ani.components "postgresql").enabled }}'
    - role: ani/valkey
      when: '{{ (index .ani.components "valkey").enabled }}'
    - role: ani/nats
      when: '{{ (index .ani.components "nats").enabled }}'
    # The observability batch follows the foundation components: the metrics
    # stack installs first because the log backend roles reuse its namespace,
    # then the log backend the site selected, then the collector. Each role is
    # skipped when its switch is off.
    #
    # Only one log backend can exist in a deployment, so loki and opensearch
    # are mutually exclusive by construction: each role runs only when the
    # selected backend is its own. A deployment can never end up with both, and
    # a deployment with no backend never gets a collector, because the
    # collector has nowhere to write.
    - role: ani/metrics
      when: '{{ (index .ani.components "metrics").enabled }}'
    - role: ani/loki
      when: '{{ and (index .ani.components "loki").enabled (eq .ani.components.logging.backend "loki") }}'
    - role: ani/opensearch
      when: '{{ and (index .ani.components "opensearch").enabled (eq .ani.components.logging.backend "opensearch") }}'
    - role: ani/fluent-bit
      when: '{{ and (index .ani.components "logging").enabled (ne .ani.components.logging.backend "none") }}'

- import_playbook: hook/post_install.yaml