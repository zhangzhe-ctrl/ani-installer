---
- name: NTP | Configure ANI isolated master and clients before Kubernetes
  command: |
    set -euo pipefail
    chronyConfigFile={{ if or (.os.release.ID | eq "ubuntu") (.os.release.ID_LIKE | eq "debian") }}"/etc/chrony/chrony.conf"{{ else }}"/etc/chrony.conf"{{ end }}
    test -f "$chronyConfigFile"
    tmp="$(mktemp "${chronyConfigFile}.ani.XXXXXX")"
    effective="$(mktemp "${chronyConfigFile}.ani-effective.XXXXXX")"
    trap 'rm -f "$tmp" "$effective"' EXIT
    # Retain drift and clock discipline settings, but exclude every inherited
    # upstream source/include and any broad NTP allow rule. No target download
    # or public clock is needed after this point.
    sed -E '/^[[:space:]]*(server|pool|peer|refclock|sourcedir|confdir|include|initstepslew|allow|deny|local|bindaddress)[[:space:]]/d' "$chronyConfigFile" > "$tmp"
    printf '\n# ANI isolated first-install time source\n' >> "$tmp"
    {{- if eq .inventory_hostname .native.ntp.isolated_master }}
    printf 'local stratum 10\nbindaddress %s\n' '{{ .native.ntp.isolated_master_ip }}' >> "$tmp"
    {{- range .native.ntp.isolated_client_ips }}
    printf 'allow %s/32\n' '{{ . }}' >> "$tmp"
    {{- end }}
    {{- else }}
    printf 'server %s iburst\n' '{{ .native.ntp.isolated_master_ip }}' >> "$tmp"
    {{- end }}
    chronyd -p -f "$tmp" > "$effective"
    {{- if eq .inventory_hostname .native.ntp.isolated_master }}
    if grep -Eq '^(server|pool|peer|refclock|initstepslew)[[:space:]]' "$effective"; then
      echo 'external time source remains in the isolated master config' >&2; exit 1
    fi
    grep -Fx 'local stratum 10' "$effective" >/dev/null
    grep -Fx 'bindaddress {{ .native.ntp.isolated_master_ip }}' "$effective" >/dev/null
    {{- range .native.ntp.isolated_client_ips }}
    grep -Fx 'allow {{ . }}/32' "$effective" >/dev/null
    {{- end }}
    {{- else }}
    test "$(grep -Ec '^server[[:space:]]' "$effective")" -eq 1
    grep -Fx 'server {{ .native.ntp.isolated_master_ip }} iburst' "$effective" >/dev/null
    if grep -Eq '^(pool|peer|refclock|initstepslew|local|allow)[[:space:]]' "$effective"; then
      echo 'unexpected time source or server mode remains in isolated client config' >&2; exit 1
    fi
    {{- end }}
    test -e "${chronyConfigFile}.ani-before" || cp -p "$chronyConfigFile" "${chronyConfigFile}.ani-before"
    chmod 0644 "$tmp"
    mv -f "$tmp" "$chronyConfigFile"
  when: .native.ntp.isolated_master | empty | not
- name: NTP | Configure NTP server
  command: |
    # Determine the correct chrony configuration file based on OS type
    chronyConfigFile={{ if or (.os.release.ID | eq "ubuntu") (.os.release.ID_LIKE | eq "debian") }}"/etc/chrony/chrony.conf"{{ else }}"/etc/chrony.conf"{{ end }}

    # Remove any existing server, allow, or local entries to ensure a clean configuration
    sed -i '/^server/d' $chronyConfigFile
    sed -i 's/^pool /#pool /g' $chronyConfigFile
    sed -i '/^allow/d' $chronyConfigFile
    sed -i '/^local/d' $chronyConfigFile

    # Add base configuration to allow all clients and set local stratum
    echo "allow 0.0.0.0/0" >> $chronyConfigFile
    echo "allow ::/0" >> $chronyConfigFile
    echo "local stratum 10" >> $chronyConfigFile

    # Add NTP server entries
    {{- range $server := .native.ntp.servers }}
      {{- $internalIPv4 := "" }}
      {{- $internalIPv6 := "" }}
      {{- range $.hostvars }}
        {{- if eq .hostname $server }}
          {{- $internalIPv4 = .internal_ipv4 | default "" }}
          {{- $internalIPv6 = .internal_ipv6 | default "" }}
        {{- end }}
      {{- end }}
    # Configuring NTP server: {{ $server }}
      {{- if $internalIPv4 | empty | not }}
    grep -q '^server {{ $internalIPv4 }} iburst' $chronyConfigFile || sed '1a server {{ $internalIPv4 }} iburst' -i $chronyConfigFile
      {{- end }}
      {{- if $internalIPv6 | empty | not }}
    grep -q '^server {{ $internalIPv6 }} iburst' $chronyConfigFile || sed '1a server [{{ $internalIPv6 }}] iburst' -i $chronyConfigFile
      {{- end }}
      {{- if and ($internalIPv4 | empty) ($internalIPv6 | empty) }}
    grep -q '^server {{ $server }} iburst' $chronyConfigFile || sed '1a server {{ $server }} iburst' -i $chronyConfigFile
      {{- end }}
    {{- end }}
  when:
    - .native.ntp.enabled
    - .native.ntp.servers | empty | not
    - .native.ntp.isolated_master | empty

- name: Timezone | Set system timezone and NTP synchronization
  command: |
    timedatectl set-timezone {{ .native.timezone }}
    timedatectl set-ntp {{ and .native.ntp.enabled (.native.ntp.servers | empty | not) }}
  when: or (and .native.ntp.enabled (.native.ntp.servers | empty | not)) (.native.timezone | empty | not)

- name: NTP | Restart NTP service
  command: |
    {{- if or (.os.release.ID | eq "ubuntu") (.os.release.ID_LIKE | eq "debian") }}
    systemctl restart chrony.service
    {{- else }}
    systemctl restart chronyd.service
    {{- end }}
  when: or (and .native.ntp.enabled (.native.ntp.servers | empty | not)) (.native.timezone | empty | not)

- name: NTP | Verify ANI isolated source is selected before Ceph
  command: |
    set -euo pipefail
    chronyc waitsync 90 0.05 0 2
    {{- if eq .inventory_hostname .native.ntp.isolated_master }}
    chronyc -n tracking | grep -Eq 'Reference ID[[:space:]]*:[[:space:]]*7F7F0101'
    {{- else }}
    chronyc -n sources | awk '$1 == "^*" { print $2 }' | grep -Fx '{{ .native.ntp.isolated_master_ip }}'
    {{- end }}
    chronyc -n tracking
    chronyc -n sources
  when: .native.ntp.isolated_master | empty | not
