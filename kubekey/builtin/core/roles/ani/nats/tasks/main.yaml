---
# ANI NATS JetStream component (official Chart nats 2.14.6).
#
# Single instance in the ani-platform namespace: cluster disabled, JetStream
# fileStore on one RWO RBD PVC (ani-block), token auth. The token is random per
# run and reaches the server only through the ani-nats-auth Secret ->
# container env TOKEN -> nats.conf "$TOKEN" expansion (the chart's documented
# "<< $TOKEN >>" mechanism). It never appears in command arguments or logs.
# natsBox stays disabled; the CLI jobs use the packaged nats-box image.
# Skipped entirely when components.nats is not enabled.
#
# Chart facts verified by rendering 2.14.6.tgz with these values on the build
# host: StatefulSet nats (replicas 1), ConfigMap nats-config, Services
# nats/nats-headless, JetStream PVC claim "nats-js", config reloader sidecar
# on. Images are overridden to offline refs via container.image.fullImageName /
# reloader.image.fullImageName (the chart's default short names would leave
# the cluster).
#
# All images come from {{ index .ani.images "docker.io/library/nats:2.14.6-alpine" }}
# style offline references; no remote registry is contacted and there is no
# network access here.

- name: ANI Nats | Assert this run's execution context
  # C07: the kubeconfig, log and fragment directories are decided once by the
  # run and published into the config spec, so a role must not pick its own
  # default. This check exists because a role can be executed on a host reached
  # over SSH where a file the parent process could read is simply absent: the
  # only acceptable answer there is to fail before the first write, not to fall
  # back to a local admin credential.
  command: |
    set -euo pipefail
    kubeconfig_file='{{ .ani.run.kubeconfig }}'
    if [ -z "$kubeconfig_file" ]; then
      echo "no kubeconfig was supplied for this run; refusing to guess one" >&2
      exit 1
    fi
    if [ ! -f "$kubeconfig_file" ]; then
      echo "kubeconfig $kubeconfig_file does not exist on this host; refusing to write component material against an unreachable context" >&2
      exit 1
    fi
    for declared in '{{ .ani.run.logs_dir }}' '{{ .ani.run.connections_dir }}'; do
      case "$declared" in
        /*) ;;
        *) echo "run scope path $declared is not absolute" >&2; exit 1 ;;
      esac
    done

- name: ANI NATS | Create work directory
  command: |
    set -euo pipefail
    install -d -m 0755 /etc/kubernetes/ani/nats
    install -d -m 0700 "{{ .ani.run.connections_dir }}"

- name: ANI NATS | Generate a stable token for this run
  command: |
    set -euo pipefail
    d=/etc/kubernetes/ani/nats
    gen_pw() {
      pw=""
      while [ "${#pw}" -ne 32 ]; do
        # NATS parses the substituted env value as a token; a leading digit
        # can make an otherwise valid alphanumeric credential fail to parse.
        pw="n$(LC_ALL=C head -c 256 /dev/urandom | LC_ALL=C tr -dc 'A-Za-z0-9' | cut -c1-31)"
      done
      printf '%s' "$pw"
    }
    if [ ! -s "$d/nats.token" ]; then gen_pw > "$d/nats.token"; fi
    chmod 0600 "$d/nats.token"

- name: ANI NATS | Create the application namespace
  command: |
    set -euo pipefail
    KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl create namespace ani-platform --dry-run=client -o yaml | KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl apply --server-side -f -

- name: ANI NATS | Create the auth token secret
  command: |
    set -euo pipefail
    KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl -n ani-platform create secret generic ani-nats-auth \
      --from-file=token=/etc/kubernetes/ani/nats/nats.token \
      --dry-run=client -o yaml | KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl apply --server-side -f -

- name: ANI NATS | Require the packaged Helm binary
  command: test -x "{{ .ani.artifact_root }}/bin/helm"

- name: ANI NATS | Render the Chart values
  template:
    src: values.yaml
    dest: /etc/kubernetes/ani/nats/values.yaml

- name: ANI NATS | Lock down the rendered values
  command: chmod 0600 /etc/kubernetes/ani/nats/values.yaml

- name: ANI NATS | Install the fixed Chart from the offline artifact
  command: >-
    KUBECONFIG="{{ .ani.run.kubeconfig }}" {{ .ani.artifact_root }}/bin/helm install nats
    {{ .ani.artifact_root }}/charts/nats/2.14.6.tgz
    --namespace ani-platform --create-namespace
    --values /etc/kubernetes/ani/nats/values.yaml
    --labels ani.io/managed-by={{ .kubernetes.cluster_name }} --wait --timeout 900s

- name: ANI NATS | Wait for StatefulSet rollout
  command: |
    KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl -n ani-platform rollout status statefulset/nats --timeout=600s

- name: ANI NATS | Wait for the JetStream RWO PVC to bind
  command: |
    KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl -n ani-platform wait --for=jsonpath='{.status.phase}=Bound' pvc/nats-js-nats-0 --timeout=300s

- name: ANI NATS | Render component verification script
  template:
    src: verify.sh
    dest: /etc/kubernetes/ani/nats/verify.sh

- name: ANI NATS | Make the verification script root-only and executable
  command: |
    set -euo pipefail
    chown root:root /etc/kubernetes/ani/nats/verify.sh
    chmod 0700 /etc/kubernetes/ani/nats/verify.sh
    test -x /etc/kubernetes/ani/nats/verify.sh

- name: ANI NATS | Run component verification
  command: |
    set -euo pipefail
    install -d -m 0700 "{{ .ani.run.logs_dir }}"
    ANI_VERIFY_OUTPUT_DIR="{{ .ani.run.logs_dir }}" \
    ANI_VERIFY_KUBECONFIG="{{ .ani.run.kubeconfig }}" \
      bash /etc/kubernetes/ani/nats/verify.sh

# Connection facts are rendered by the role that owns the resources, so the
# installer never keeps a second copy of service names or Secret references.
# The installer concatenates the fragments into connections.md after a
# successful run; no fragment contains credentials.
- name: ANI NATS | Render connection facts fragment
  template:
    src: connection.md
    dest: "{{ .ani.run.connections_dir }}/nats.md"
