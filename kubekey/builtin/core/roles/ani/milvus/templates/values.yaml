# Milvus Chart 5.0.25; the chart declares app 2.6.21, explicitly override to
# v2.6.24. The OBC supplies credentials through Secret-backed environment vars;
# no S3 key enters the Helm values, release Secret or ConfigMap.
cluster:
  enabled: false
image:
  all:
    repository: {{ .ani.registry }}/milvusdb/milvus
    tag: v2.6.24
standalone:
  replicas: 1
  messageQueue: rocksmq
  persistence:
    enabled: true
    persistentVolumeClaim:
      storageClass: {{ .ani.components.milvus.storage_class }}
      size: {{ .ani.components.milvus.storage_size }}
  extraEnv:
    - name: SSL_CERT_FILE
      value: {{ .ani.objectStorage.milvus_s3.ca_path }}
    - name: AWS_CA_BUNDLE
      value: {{ .ani.objectStorage.milvus_s3.ca_path }}
    - name: MINIO_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: {{ .ani.objectStorage.milvus_s3.secret_name }}
          key: {{ .ani.objectStorage.milvus_s3.access_key_field }}
    - name: MINIO_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: {{ .ani.objectStorage.milvus_s3.secret_name }}
          key: {{ .ani.objectStorage.milvus_s3.secret_key_field }}
etcd:
  enabled: true
  replicaCount: 1
  image:
    registry: {{ .ani.registry }}
    repository: milvusdb/etcd
    tag: 3.5.25-r1
  persistence:
    enabled: true
    storageClass: {{ .ani.components.milvus.storage_class }}
    size: {{ .ani.components.milvus.etcd_storage_size }}
minio:
  enabled: false
pulsarv3:
  enabled: false
pulsar:
  enabled: false
kafka:
  enabled: false
woodpecker:
  enabled: false
tei:
  enabled: false
volumes:
  - name: {{ .ani.objectStorage.milvus_s3.ca_config_map }}
    configMap:
      name: {{ .ani.objectStorage.milvus_s3.ca_config_map }}
volumeMounts:
  - name: {{ .ani.objectStorage.milvus_s3.ca_config_map }}
    mountPath: {{ .ani.objectStorage.milvus_s3.ca_mount_path }}
    readOnly: true
externalS3:
  enabled: true
  host: {{ .ani.objectStorage.milvus_s3.host }}
  port: {{ .ani.objectStorage.milvus_s3.port }}
  accessKey: ""
  secretKey: ""
  useSSL: true
  region: {{ .ani.objectStorage.milvus_s3.region }}
  bucketName: {{ .ani.objectStorage.milvus_s3.bucket }}
  rootPath: {{ .ani.objectStorage.milvus_s3.root_path }}
  cloudProvider: aws
  useVirtualHost: false
# Milvus v2.6.24 defaults minio.ssl.tlsCACert to /path/to/public.crt.
# That value overwrites SSL_CERT_FILE inside NewMinioClient; bind the mounted
# CA in Milvus' highest-priority user.yaml as well as the process environment.
extraConfigFiles:
  user.yaml: |+
    minio:
      ssl:
        tlsCACert: {{ .ani.objectStorage.milvus_s3.ca_path }}
