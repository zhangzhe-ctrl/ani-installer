apiVersion: v1
kind: Pod
metadata:
  name: ani-b05-guest
  namespace: ani-platform
  labels:
    app: ani-b05-guest
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
spec:
  restartPolicy: Always
  containers:
    - name: httpd
      image: {{ index .ani.images "docker.io/library/busybox:1.37.0" }}
      command: ["/bin/sh", "-c", "exec httpd -f -p 8080 -h /srv"]
      ports:
        - containerPort: 8080
      volumeMounts:
        - {name: disk, mountPath: /srv}
      readinessProbe:
        tcpSocket: {port: 8080}
        periodSeconds: 2
  volumes:
    - name: disk
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ani-b05-guest
  namespace: ani-platform
  labels:
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
spec:
  selector: {app: ani-b05-guest}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
