apiVersion: v1
kind: Pod
metadata:
  name: ani-smoke-network-client
  namespace: ani-installer-smoke
spec:
  nodeName: {{ index .ani.nodes 2 }}
  restartPolicy: Never
  containers:
    - name: network-client
      image: {{ index .ani.images "docker.io/library/busybox:1.37.0" }}
      command: ["/bin/sh", "-c"]
      args:
        - >-
          direct="$(wget -qO- http://{{ .ani_smoke_backend_ip.stdout }}:3000/)";
          service="$(wget -qO- http://{{ .ani_smoke_backend_service_ip.stdout }}/)";
          dns="$(wget -qO- http://ani-smoke-backend.ani-installer-smoke.svc.cluster.local/)";
          test "$direct" = "ANI-INSTALLER-OK";
          test "$service" = "ANI-INSTALLER-OK";
          test "$dns" = "ANI-INSTALLER-OK";
          printf 'ANI-NETWORK-OK\n'