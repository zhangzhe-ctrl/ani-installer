---
- name: ANI Smoke | Create work directory
  command: install -d -m 0755 /etc/kubernetes/ani

- name: ANI Smoke | Create namespace
  command: |
    set -euo pipefail
    KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl create namespace ani-installer-smoke --dry-run=client -o yaml | KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl apply -f -

- name: ANI Smoke | Render Gateway
  template:
    src: gateway.yaml
    dest: /etc/kubernetes/ani/smoke-gateway.yaml

- name: ANI Smoke | Apply Gateway
  command: KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl apply --server-side -f /etc/kubernetes/ani/smoke-gateway.yaml

- name: ANI Smoke | Render backend Pod
  template:
    src: backend-pod.yaml
    dest: /etc/kubernetes/ani/smoke-backend-pod.yaml

- name: ANI Smoke | Apply backend Pod
  command: KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl apply --server-side -f /etc/kubernetes/ani/smoke-backend-pod.yaml

- name: ANI Smoke | Wait for backend Pod
  command: KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl wait --for=condition=Ready pod/ani-smoke-backend -n ani-installer-smoke --timeout=180s

- name: ANI Smoke | Get backend Pod IP
  command: KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl get pod ani-smoke-backend -n ani-installer-smoke -o jsonpath='{.status.podIP}'
  register: ani_smoke_backend_ip

- name: ANI Smoke | Render backend Service
  template:
    src: backend-service.yaml
    dest: /etc/kubernetes/ani/smoke-backend-service.yaml

- name: ANI Smoke | Apply backend Service
  command: KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl apply --server-side -f /etc/kubernetes/ani/smoke-backend-service.yaml

- name: ANI Smoke | Render Backend
  template:
    src: backend.yaml
    dest: /etc/kubernetes/ani/smoke-backend.yaml

- name: ANI Smoke | Apply Backend
  command: KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl apply --server-side -f /etc/kubernetes/ani/smoke-backend.yaml

- name: ANI Smoke | Render HTTPRoute
  template:
    src: httproute.yaml
    dest: /etc/kubernetes/ani/smoke-httproute.yaml

- name: ANI Smoke | Apply HTTPRoute
  command: KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl apply --server-side -f /etc/kubernetes/ani/smoke-httproute.yaml

- name: ANI Smoke | Wait for Envoy data-plane Deployment
  command: KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl rollout status deployment -n ani-installer-smoke --timeout=300s

- name: ANI Smoke | Render active probe
  template:
    src: probe.sh
    dest: /etc/kubernetes/ani/smoke-probe.sh
    mode: "0755"

- name: ANI Smoke | Run active network and Envoy probe
  command: KUBECONFIG_FILE="{{ .ani.run.kubeconfig }}" ANI_SMOKE_OUTPUT=/etc/kubernetes/ani/smoke-output bash /etc/kubernetes/ani/smoke-probe.sh