---
# ANI OpenSearch (official Chart 3.8.0).
#
# One single-node master in the ani-observability namespace under release name
# ani-opensearch-master, on one ani-block RBD PVC. The security plugin is on:
# the nodes and the HTTP layer use certificates from cert-manager's internal
# CA, and authentication is enforced against the internal user database. The
# image's demo configuration is never installed, so there is no demo user and
# no default password anywhere in this deployment.
#
# Skipped entirely when the selected backend is not opensearch. The role does
# not also deploy Fluent Bit: collection is a separate role so that collection
# can never exist without a backend, and a backend can be installed and
# verified before anything writes to it.
#
# The credential is generated here, once, on the node: the admin password is
# created with the node's own random source, its bcrypt hash is computed with
# the hash tool the OpenSearch image ships, and only the hash and a separately
# generated collector password ever reach the cluster. The plaintext admin
# password is stored in a Secret the operator can read and is never written to
# a rendered file, a log, or a connection fragment.
#
# No image is fetched from a remote registry: the cluster image and the chart's
# chown init image are rewritten to the site registry in values.yaml.

- name: ANI OpenSearch | Create work directory
  command: |
    install -d -m 0755 /etc/kubernetes/ani/opensearch
    install -d -m 0700 "/var/lib/ani-installer/{{ .kubernetes.cluster_name }}/work/connections.d"

- name: ANI OpenSearch | Create the observability namespace
  command: |
    kubectl create namespace {{ .ani.components.logging.namespace }} --dry-run=client -o yaml | kubectl apply --server-side -f -

- name: ANI OpenSearch | Require the packaged Helm binary
  command: test -x "{{ .ani.artifact_root }}/bin/helm"

# OpenSearch refuses to start when vm.max_map_count is below its required
# minimum, and the chart's own remedy is a privileged init container. The
# setting is a node property, so it is set on the node instead, where it also
# survives a pod rebuild. The write is idempotent and applies at boot.
- name: ANI OpenSearch | Raise vm.max_map_count on every node
  command: |
    set -euo pipefail
    want=262144
    cat > /etc/sysctl.d/90-ani-opensearch.conf <<'SYSCTL'
    # Required by OpenSearch. Set here rather than by the Chart's privileged
    # init container, so the setting is a node property that also applies at
    # boot rather than being reapplied by every pod start.
    vm.max_map_count = 262144
    SYSCTL
    sysctl -w vm.max_map_count=$want >/dev/null
    current="$(sysctl -n vm.max_map_count)"
    if [ "$current" -lt "$want" ]; then
      echo "vm.max_map_count is $current, below the required $want" >&2
      exit 1
    fi

# The node certificate and the admin certificate come from the internal CA
# cert-manager installed earlier in the batch. Two separate certificates: the
# node one is what the transport layer presents and what nodes_dn.yml allows,
# the admin one is what securityadmin.sh uses to seed the security index.
- name: ANI OpenSearch | Render the TLS certificate requests
  template:
    src: certificates.yaml
    dest: /etc/kubernetes/ani/opensearch/certificates.yaml

- name: ANI OpenSearch | Issue the node and admin certificates
  command: |
    kubectl apply -f /etc/kubernetes/ani/opensearch/certificates.yaml

# cert-manager issues asynchronously, so the readiness of both Certificates is
# waited on before anything reads the resulting Secrets. Without this the chart
# would be installed with an empty TLS directory and OpenSearch would fail
# closed on a missing key file.
- name: ANI OpenSearch | Wait for both certificates to be issued
  command: |
    set -euo pipefail
    for cert in ani-opensearch-node-tls ani-opensearch-admin-tls; do
      kubectl -n {{ .ani.components.logging.namespace }} wait \
        --for=condition=Ready "certificate/$cert" --timeout=300s
    done

- name: ANI OpenSearch | Render the Chart values
  template:
    src: values.yaml
    dest: /etc/kubernetes/ani/opensearch/values.yaml

- name: ANI OpenSearch | Lock down the rendered values
  command: chmod 0600 /etc/kubernetes/ani/opensearch/values.yaml

- name: ANI OpenSearch | Install the fixed Chart from the offline artifact
  command: >-
    {{ .ani.artifact_root }}/bin/helm upgrade --install ani-opensearch-master
    {{ .ani.artifact_root }}/charts/opensearch/3.8.0.tgz
    --namespace {{ .ani.components.logging.namespace }} --create-namespace
    --values /etc/kubernetes/ani/opensearch/values.yaml
    --wait --timeout 1200s

# The cluster is a StatefulSet in this Chart, so this waits for the same object
# the Chart renders rather than for a Deployment that does not exist.
- name: ANI OpenSearch | Wait for the OpenSearch StatefulSet
  command: |
    kubectl -n {{ .ani.components.logging.namespace }} rollout status \
      statefulset/ani-opensearch-master --timeout=900s

- name: ANI OpenSearch | Wait for the data PVC to bind
  command: |
    set -euo pipefail
    kubectl -n {{ .ani.components.logging.namespace }} wait \
      --for=jsonpath='{.status.phase}'=Bound pvc/ani-opensearch-master-0 --timeout=300s

# The security index has to be seeded before the cluster is usable: with
# allow_default_init_securityindex false the plugin will not create it on its
# own, so until securityadmin.sh runs every authenticated request is refused.
# The password is generated here, the hash is computed with the image's own
# tool, and only the hash and the collector credential are written to the
# cluster.
- name: ANI OpenSearch | Render the security initialization manifests
  template:
    src: security-init.yaml
    dest: /etc/kubernetes/ani/opensearch/security-init.yaml

- name: ANI OpenSearch | Render the security configuration files
  template:
    src: security-config.yaml
    dest: /etc/kubernetes/ani/opensearch/security-config.yaml

- name: ANI OpenSearch | Render the index setup script
  template:
    src: setup-indices.sh
    dest: /etc/kubernetes/ani/opensearch/setup-indices.sh

- name: ANI OpenSearch | Render component verification script
  template:
    src: verify.sh
    dest: /etc/kubernetes/ani/opensearch/verify.sh

- name: ANI OpenSearch | Make the scripts root-only and executable
  command: |
    set -euo pipefail
    for script in setup-indices.sh verify.sh; do
      chown root:root "/etc/kubernetes/ani/opensearch/$script"
      chmod 0700 "/etc/kubernetes/ani/opensearch/$script"
      test -x "/etc/kubernetes/ani/opensearch/$script"
    done

- name: ANI OpenSearch | Seed the security index and the collector credential
  command: |
    set -euo pipefail
    kubectl apply -f /etc/kubernetes/ani/opensearch/security-config.yaml

    # The hashing Job creates the hash, the admin credential and the collector
    # credential in one step, so all three always agree. It is a one-shot Job
    # rather than an init container because it has to run after the cluster is
    # up, not as part of it.
    kubectl -n {{ .ani.components.logging.namespace }} wait \
      --for=condition=Complete job/ani-opensearch-security-init --timeout=900s

    # A failed Job must stop the install here rather than leave a cluster that
    # no client can authenticate to.
    succeeded="$(kubectl -n {{ .ani.components.logging.namespace }} get job \
      ani-opensearch-security-init -o jsonpath='{.status.succeeded}')"
    if [ "$succeeded" != "1" ]; then
      echo "the security initialization Job did not succeed" >&2
      exit 1
    fi

- name: ANI OpenSearch | Create the day-index template and the retention policy
  command: |
    set -euo pipefail
    install -d -m 0700 /etc/kubernetes/ani/opensearch/evidence
    ANI_OPENSEARCH_EVIDENCE_DIR=/etc/kubernetes/ani/opensearch/evidence \
      bash /etc/kubernetes/ani/opensearch/setup-indices.sh

# This verifies the backend's own capabilities (API, TLS, authentication, index
# template, retention policy, PVC). The end-to-end path from a container's
# stdout through Fluent Bit into this backend belongs to the Fluent Bit role,
# which runs after this one.
- name: ANI OpenSearch | Run component verification
  command: |
    install -d -m 0700 "/var/lib/ani-installer/{{ .kubernetes.cluster_name }}/logs"
    ANI_VERIFY_OUTPUT_DIR="/var/lib/ani-installer/{{ .kubernetes.cluster_name }}/logs" \
      bash /etc/kubernetes/ani/opensearch/verify.sh

- name: ANI OpenSearch | Render connection facts fragment
  template:
    src: connection.md
    dest: "/var/lib/ani-installer/{{ .kubernetes.cluster_name }}/work/connections.d/opensearch.md"
