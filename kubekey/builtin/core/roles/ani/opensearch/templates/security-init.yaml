# ANI OpenSearch security initialization.
#
# A one-shot Job that does four things in order, inside the cluster, with the
# locked OpenSearch image (so the hash tool and securityadmin.sh are the ones
# that belong to this exact version):
#
#   1. generates the administrator password, the reserved account's password and
#      the collector password with the pod's own random source. None is printed:
#      each goes into a Secret, and the administrator's bcrypt hash goes into the
#      security configuration that securityadmin.sh loads;
#   2. rewrites the placeholder hashes in the mounted security configuration and
#      adds the collector user, its role and its role mapping. Doing it here
#      rather than in the rendered Secret keeps the hash out of the repository,
#      and it also means the files loaded into the security index and the
#      credential the collector is given are produced by the same step, so they
#      cannot disagree;
#   3. runs securityadmin.sh once with the administrator certificate, which
#      creates the security index and the users. This has to happen:
#      allow_default_init_securityindex is false, so the plugin will not create
#      the index by itself, and until it exists every authenticated request is
#      refused;
#   4. creates the two credential Secrets. The collector's one is what the
#      Fluent Bit role reads; creating it here is what ties it to a user that
#      actually exists in this cluster's security index.
#
# The plaintext never reaches a file that outlives this pod: the configuration
# copy lives in an emptyDir, and the credentials are written through the API.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ani-opensearch-security-init
  namespace: {{ .ani.components.logging.namespace }}
  labels:
    app.kubernetes.io/part-of: ani-observability
spec:
  # One retry: a failure here means the cluster was not ready rather than that
  # the approach is wrong. The installer waits on this Job and fails the install
  # if it does not succeed.
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ani-observability
        app.kubernetes.io/component: ani-opensearch-security-init
    spec:
      restartPolicy: Never
      serviceAccountName: ani-opensearch-security-init
      initContainers:
        # A27: the work emptyDir is created root-owned, but this Job runs as
        # uid 1000 (runAsNonRoot). Pre-own it from a root busybox so the main
        # container can cp/chmod inside without touching the root directory's
        # own ownership (the a7-a10 failures).
        - name: security-config-ownership
          image: {{ index .ani.images "docker.io/library/busybox:1.37.0" }}
          # A30: the credential Secrets at the end of the script are written
          # with kubectl, which the OpenSearch image does not ship. Copy the
          # node's static kubectl into the work dir next to the ownership fix.
          command: ["sh", "-c", "chown -R 1000:1000 /tmp/security-config && cp -f /host-kubectl/kubectl /tmp/kubectl-bin/kubectl && chmod 0555 /tmp/kubectl-bin/kubectl"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: work
              mountPath: /tmp/security-config
            - name: kubectl-bin
              mountPath: /tmp/kubectl-bin
            - name: host-kubectl
              mountPath: /host-kubectl
              readOnly: true
      containers:
        - name: security-init
          image: "{{ .ani.registry }}/{{ .ani.image_parts.logs.opensearch.repository }}:{{ .ani.image_parts.logs.opensearch.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              OS_HOME=/usr/share/opensearch
              SEC_TOOLS="$OS_HOME/plugins/opensearch-security/tools"
              SEC_ADMIN="$SEC_TOOLS/securityadmin.sh"
              CONFIG=/tmp/security-config
              OS_HOST="ani-opensearch-master.{{ .ani.components.logging.namespace }}.svc.cluster.local"

              # securityadmin.sh needs a JVM; the image ships one at this path.
              export JAVA_HOME="${JAVA_HOME:-$OS_HOME/jdk}"
              # A30: kubectl for the credential Secrets comes from the work
              # dir, seeded by the init container from the node.
              export PATH="/tmp/kubectl-bin:$PATH"

              # ---------------------------------------------------------------
              echo "== generating credentials =="
              # The pod's own random source. The output is base64 with the
              # characters that need quoting removed, so the value survives every
              # place it is passed through below.
              gen_pw() { head -c 32 /dev/urandom | base64 | tr -d '\n=+/' | cut -c1-24; }

              ADMIN_PW="$(gen_pw)"
              RESERVED_PW="$(gen_pw)"
              COLLECTOR_PW="$(gen_pw)"

              hash_of() {
                "$SEC_TOOLS/hash.sh" -p "$1" | tr -d '\r'
              }

              ADMIN_HASH="$(hash_of "$ADMIN_PW")"
              RESERVED_HASH="$(hash_of "$RESERVED_PW")"
              COLLECTOR_HASH="$(hash_of "$COLLECTOR_PW")"
              # A hash that is not bcrypt means the tool failed and the plugin
              # would refuse every login, so this is checked before anything is
              # loaded.
              for h in "$ADMIN_HASH" "$RESERVED_HASH" "$COLLECTOR_HASH"; do
                case "$h" in
                  \$2*) ;;
                  *) echo "hash.sh did not return a bcrypt hash" >&2; exit 1 ;;
                esac
              done

              # ---------------------------------------------------------------
              echo "== preparing the security configuration =="
              # A27: the emptyDir root is pre-owned by uid 1000 through the
              # root init container below, so both the copy (times included)
              # and the recursive chmod succeed as this user.
              cp -a /security-config/. "$CONFIG/"
              # Defensive: keep the copied security config owner-writable even
              # if a stricter source mode ever lands in the upstream material.
              chmod -R u+w "$CONFIG"

              # The placeholder hashes are replaced in order: the first is
              # admin, the second is the reserved account. A29: the sed
              # substitutes only the placeholder VALUE — the earlier full-line
              # rewrite hardcoded a 6-space indent that broke the file's 2-space
              # structure and made securityadmin fail the whole upload with
              # "expected <block end>, but found <block mapping start>"
              # (observed live on kubeovn-full-h5a12).
              admin_line="$(grep -n 'PLACEHOLDER' "$CONFIG/internal_users.yml" | sed -n '1p' | cut -d: -f1)"
              reserved_line="$(grep -n 'PLACEHOLDER' "$CONFIG/internal_users.yml" | sed -n '2p' | cut -d: -f1)"
              if [ -z "$admin_line" ] || [ -z "$reserved_line" ]; then
                echo "expected two placeholder hashes in internal_users.yml" >&2
                exit 1
              fi
              sed -i "${admin_line}s|PLACEHOLDER-REPLACED-AT-INSTALL-TIME|$ADMIN_HASH|" "$CONFIG/internal_users.yml"
              sed -i "${reserved_line}s|PLACEHOLDER-REPLACED-AT-INSTALL-TIME|$RESERVED_HASH|" "$CONFIG/internal_users.yml"

              if grep -q 'PLACEHOLDER' "$CONFIG/internal_users.yml"; then
                echo "a placeholder hash was not replaced" >&2
                exit 1
              fi

              # The collector account: a dedicated user that may only write to
              # this installation's log indices and read nothing else. Adding it
              # to the three files here, rather than carrying it in the rendered
              # Secret, is what keeps its hash out of the repository.
              cat >> "$CONFIG/internal_users.yml" <<EOF

              ani-collector:
                hash: "$COLLECTOR_HASH"
                reserved: false
                backend_roles:
                  - "ani_collector"
                description: "ANI Fluent Bit log writer"
              EOF

              cat >> "$CONFIG/roles.yml" <<'EOF'

              ani_collector_role:
                reserved: false
                cluster_permissions:
                  - "cluster_monitor"
                  # A35: opensearch-security checks the bulk write at BOTH
                  # levels — this cluster-level entry is required for the
                  # _bulk endpoint, and the index-level "bulk[s]" below covers
                  # the per-index check. Without BOTH the write always 403s.
                  - "indices:data/write/bulk"
                index_permissions:
                  - index_patterns:
                      - "ani-logs-*"
                    allowed_actions:
                      - "read"
                      - "create_index"
                      - "indices:data/write/index"
                      - "indices:data/write/bulk"
                      # A36a: the fluent-bit verify queries the markers back
                      # through this identity, so read is required; A35-final:
                      # bulk[s] is the form opensearch-security checks for
                      # index requests arriving through the bulk endpoint.
                      - "indices:data/write/bulk[s]"
                      - "indices:admin/mapping/put"
                      - "indices:admin/get"
                      - "indices:admin/create"
                tenant_permissions: []
              EOF

              cat >> "$CONFIG/roles_mapping.yml" <<'EOF'

              ani_collector_role:
                reserved: false
                backend_roles:
                  - "ani_collector"
                description: "Maps the collector backend role to its own write-only role"
              EOF

              # ---------------------------------------------------------------
              echo "== waiting for the cluster to accept connections =="
              # The cluster is started before this Job runs, but its security
              # plugin refuses unauthenticated requests, so readiness is tested
              # with a TCP connect rather than an HTTP call.
              ready=0
              for i in $(seq 1 90); do
                if (exec 3<>/dev/tcp/"$OS_HOST"/9200) 2>/dev/null; then
                  exec 3<&- 3>&-
                  ready=1
                  break
                fi
                sleep 5
              done
              if [ "$ready" != "1" ]; then
                echo "the OpenSearch service did not accept a connection" >&2
                exit 1
              fi

              # ---------------------------------------------------------------
              echo "== seeding the security index =="
              # -cd loads the whole directory in one run. There is no demo flag
              # and no default password: the cluster was asked not to initialize
              # its security index by itself, and this is the only thing that
              # creates it.
              "$SEC_ADMIN" \
                -cd "$CONFIG" \
                -cacert /admin-tls/ca.crt \
                -cert /admin-tls/tls.crt \
                -key /admin-tls/tls.key \
                -h "$OS_HOST" \
                -p 9200 \
                -icl -nhnv

              # ---------------------------------------------------------------
              echo "== writing the credential Secrets =="
              kubectl -n {{ .ani.components.logging.namespace }} create secret generic \
                ani-opensearch-admin \
                --from-literal=username=admin \
                --from-literal=password="$ADMIN_PW" \
                --dry-run=client -o yaml \
                | kubectl -n {{ .ani.components.logging.namespace }} apply --server-side -f -

              kubectl -n {{ .ani.components.logging.namespace }} create secret generic \
                ani-opensearch-fluent-bit \
                --from-literal=username=ani-collector \
                --from-literal=password="$COLLECTOR_PW" \
                --dry-run=client -o yaml \
                | kubectl -n {{ .ani.components.logging.namespace }} apply --server-side -f -

              echo "security initialization complete"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: security-config
              mountPath: /security-config
              readOnly: true
            - name: admin-tls
              mountPath: /admin-tls
              readOnly: true
            # The writable copy the placeholders are replaced in. A secret mount
            # is read-only, so the configuration cannot be edited in place.
            - name: work
              mountPath: /tmp/security-config
            - name: kubectl-bin
              mountPath: /tmp/kubectl-bin
              readOnly: true
      volumes:
        - name: host-kubectl
          hostPath:
            path: /usr/local/bin
            type: Directory
        - name: kubectl-bin
          emptyDir: {}
        - name: security-config
          secret:
            secretName: ani-opensearch-security-config
        - name: admin-tls
          secret:
            secretName: ani-opensearch-admin-tls
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ani-opensearch-security-init
  namespace: {{ .ani.components.logging.namespace }}
  labels:
    app.kubernetes.io/part-of: ani-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ani-opensearch-security-init
  namespace: {{ .ani.components.logging.namespace }}
  labels:
    app.kubernetes.io/part-of: ani-observability
rules:
  # This Job reads the two TLS Secrets and writes the two credential Secrets.
  # It gets no other access: it never lists or watches anything, and never
  # touches a Secret outside its own namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ani-opensearch-security-init
  namespace: {{ .ani.components.logging.namespace }}
  labels:
    app.kubernetes.io/part-of: ani-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ani-opensearch-security-init
subjects:
  - kind: ServiceAccount
    name: ani-opensearch-security-init
    namespace: {{ .ani.components.logging.namespace }}
