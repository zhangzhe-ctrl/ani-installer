---
# ANI metrics stack (official Chart kube-prometheus-stack 85.4.0).
#
# One release named ani-metrics in the ani-observability namespace: the
# Prometheus Operator, one Prometheus, one Alertmanager, one kube-state-metrics
# and a node-exporter DaemonSet. Grafana, Thanos, remote write and every
# ingress are off. Prometheus and Alertmanager keep their data on ani-block RBD
# PVCs, so a normal pod rebuild reads the same series and silences back.
#
# Skipped entirely when components.metrics is not enabled.
#
# Chart facts verified by rendering 85.4.0.tgz with these values on the build
# host: operator Deployment ani-metrics-operator, Service ani-metrics-operator,
# admission/CRD/cleanup hooks (create/patch/DELETE jobs), the three bundled
# sub-chart workloads, and a Prometheus/Alertmanager CR whose image fields are
# the only place those two images appear. The annotation on the CRs is what
# makes the Operator reconcile them, so nothing is left "rendered but inert".
#
# Every image comes from {{ index .ani.images "..." }}; no remote registry is
# contacted and there is no network access here.

- name: ANI Metrics | Assert this run's execution context
  # C07: the kubeconfig, log and fragment directories are decided once by the
  # run and published into the config spec, so a role must not pick its own
  # default. This check exists because a role can be executed on a host reached
  # over SSH where a file the parent process could read is simply absent: the
  # only acceptable answer there is to fail before the first write, not to fall
  # back to a local admin credential.
  command: |
    set -euo pipefail
    kubeconfig_file='{{ .ani.run.kubeconfig }}'
    if [ -z "$kubeconfig_file" ]; then
      echo "no kubeconfig was supplied for this run; refusing to guess one" >&2
      exit 1
    fi
    if [ ! -f "$kubeconfig_file" ]; then
      echo "kubeconfig $kubeconfig_file does not exist on this host; refusing to write component material against an unreachable context" >&2
      exit 1
    fi
    for declared in '{{ .ani.run.logs_dir }}' '{{ .ani.run.connections_dir }}'; do
      case "$declared" in
        /*) ;;
        *) echo "run scope path $declared is not absolute" >&2; exit 1 ;;
      esac
    done

- name: ANI Metrics | Create work directory
  command: |
    set -euo pipefail
    install -d -m 0755 /etc/kubernetes/ani/metrics
    install -d -m 0700 "{{ .ani.run.connections_dir }}"

- name: ANI Metrics | Create the observability namespace
  command: |
    set -euo pipefail
    KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl create namespace {{ .ani.components.metrics.namespace }} --dry-run=client -o yaml | KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl apply --server-side -f -

- name: ANI Metrics | Require the packaged Helm binary
  command: test -x "{{ .ani.artifact_root }}/bin/helm"

- name: ANI Metrics | Render the Chart values
  template:
    src: values.yaml
    dest: /etc/kubernetes/ani/metrics/values.yaml

- name: ANI Metrics | Lock down the rendered values
  command: chmod 0600 /etc/kubernetes/ani/metrics/values.yaml

- name: ANI Metrics | Install the fixed Chart from the offline artifact
  command: >-
    KUBECONFIG="{{ .ani.run.kubeconfig }}" {{ .ani.artifact_root }}/bin/helm install ani-metrics
    {{ .ani.artifact_root }}/charts/kube-prometheus-stack/85.4.0.tgz
    --namespace {{ .ani.components.metrics.namespace }} --create-namespace
    --values /etc/kubernetes/ani/metrics/values.yaml
    --labels ani.io/managed-by={{ .kubernetes.cluster_name }} --wait --timeout 1200s

# The Operator runs first and creates the two custom resources' workloads, so
# waiting on the operator alone would return before Prometheus exists.
- name: ANI Metrics | Wait for the Prometheus Operator
  command: |
    KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl -n {{ .ani.components.metrics.namespace }} rollout status \
      deployment/ani-metrics-operator --timeout=600s

- name: ANI Metrics | Wait for the Prometheus StatefulSet
  command: |
    KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl -n {{ .ani.components.metrics.namespace }} rollout status \
      statefulset/prometheus-ani-metrics-prometheus --timeout=900s

- name: ANI Metrics | Wait for the Alertmanager StatefulSet
  command: |
    KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl -n {{ .ani.components.metrics.namespace }} rollout status \
      statefulset/alertmanager-ani-metrics-alertmanager --timeout=600s

- name: ANI Metrics | Wait for kube-state-metrics
  command: |
    KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl -n {{ .ani.components.metrics.namespace }} rollout status \
      deployment/ani-metrics-kube-state-metrics --timeout=600s

- name: ANI Metrics | Wait for the node-exporter DaemonSet on every node
  command: |
    set -euo pipefail
    want="$(KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl get nodes --no-headers | wc -l)"
    KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl -n {{ .ani.components.metrics.namespace }} rollout status \
      daemonset/ani-metrics-prometheus-node-exporter --timeout=600s
    got="$(KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl -n {{ .ani.components.metrics.namespace }} get daemonset \
      ani-metrics-prometheus-node-exporter -o jsonpath='{.status.numberReady}')"
    if [ "$got" != "$want" ]; then
      echo "node-exporter ready on $got of $want nodes" >&2
      exit 1
    fi

- name: ANI Metrics | Wait for both data PVCs to bind
  command: |
    set -euo pipefail
    for pvc in prometheus-ani-metrics-prometheus-db-prometheus-ani-metrics-prometheus-0 \
               alertmanager-ani-metrics-alertmanager-db-alertmanager-ani-metrics-alertmanager-0; do
      KUBECONFIG="{{ .ani.run.kubeconfig }}" kubectl -n {{ .ani.components.metrics.namespace }} wait \
        --for=jsonpath='{.status.phase}'=Bound "pvc/$pvc" --timeout=300s
    done

- name: ANI Metrics | Render component verification script
  template:
    src: verify.sh
    dest: /etc/kubernetes/ani/metrics/verify.sh

- name: ANI Metrics | Make the verification script root-only and executable
  command: |
    set -euo pipefail
    chown root:root /etc/kubernetes/ani/metrics/verify.sh
    chmod 0700 /etc/kubernetes/ani/metrics/verify.sh
    test -x /etc/kubernetes/ani/metrics/verify.sh

- name: ANI Metrics | Run component verification
  command: |
    set -euo pipefail
    install -d -m 0700 "{{ .ani.run.logs_dir }}"
    ANI_VERIFY_LEVEL=smoke \
    ANI_VERIFY_OUTPUT_DIR="{{ .ani.run.logs_dir }}" \
    ANI_VERIFY_KUBECONFIG="{{ .ani.run.kubeconfig }}" \
      bash /etc/kubernetes/ani/metrics/verify.sh

# Connection facts are rendered by the role that owns the resources, so the
# installer never keeps a second copy of service names or Secret references.
# The installer concatenates the fragments into connections.md after a
# successful run; no fragment contains credentials.
- name: ANI Metrics | Render connection facts fragment
  template:
    src: connection.md
    dest: "{{ .ani.run.connections_dir }}/metrics.md"
