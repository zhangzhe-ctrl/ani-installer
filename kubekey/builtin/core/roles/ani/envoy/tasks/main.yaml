---
- name: ANI Envoy | Create work directory
  command: install -d -m 0755 /etc/kubernetes/ani

- name: ANI Envoy | Render orphan LSP cleanup
  template:
    src: cleanup-orphan-lsp.py
    dest: /etc/kubernetes/ani/cleanup-orphan-lsp.py

- name: ANI Envoy | Remove orphan LSPs before base install
  command: python3 /etc/kubernetes/ani/cleanup-orphan-lsp.py

- name: ANI Envoy | Render base install manifest
  template:
    src: install.yaml
    dest: /etc/kubernetes/ani/envoy-install.yaml

- name: ANI Envoy | Apply base install manifest
  command: kubectl apply --server-side -f /etc/kubernetes/ani/envoy-install.yaml

- name: ANI Envoy | Wait for required CRDs
  command: |
    kubectl wait --for=condition=Established \
      crd/backends.gateway.envoyproxy.io \
      crd/envoyproxies.gateway.envoyproxy.io \
      crd/gatewayclasses.gateway.networking.k8s.io \
      --timeout=180s

- name: ANI Envoy | Remove orphan LSPs after base install
  command: python3 /etc/kubernetes/ani/cleanup-orphan-lsp.py

- name: ANI Envoy | Render GatewayNamespace RBAC
  template:
    src: gateway-namespace-mode.yaml
    dest: /etc/kubernetes/ani/envoy-gateway-namespace-mode.yaml

- name: ANI Envoy | Apply GatewayNamespace RBAC
  command: kubectl apply --server-side -f /etc/kubernetes/ani/envoy-gateway-namespace-mode.yaml

- name: ANI Envoy | Render controller configuration
  template:
    src: envoy-gateway-config.yaml
    dest: /etc/kubernetes/ani/envoy-gateway.yaml

- name: ANI Envoy | Write controller configuration
  command: kubectl create configmap envoy-gateway-config -n envoy-gateway-system --from-file=envoy-gateway.yaml=/etc/kubernetes/ani/envoy-gateway.yaml --dry-run=client -o yaml | kubectl apply -f -

- name: ANI Envoy | Restart controller
  command: kubectl rollout restart deployment/envoy-gateway -n envoy-gateway-system

- name: ANI Envoy | Wait for controller
  command: kubectl rollout status deployment/envoy-gateway -n envoy-gateway-system --timeout=300s

- name: ANI Envoy | Render small NoEIP EnvoyProxy
  template:
    src: envoy-proxy.yaml
    dest: /etc/kubernetes/ani/envoy-proxy-small-noeip.yaml

- name: ANI Envoy | Apply small NoEIP EnvoyProxy
  command: kubectl apply --server-side -f /etc/kubernetes/ani/envoy-proxy-small-noeip.yaml

- name: ANI Envoy | Render NoEIP GatewayClass
  template:
    src: gatewayclass.yaml
    dest: /etc/kubernetes/ani/gatewayclass-lb-small-noeip.yaml

- name: ANI Envoy | Apply NoEIP GatewayClass
  command: kubectl apply --server-side -f /etc/kubernetes/ani/gatewayclass-lb-small-noeip.yaml

- name: ANI Envoy | Wait for NoEIP GatewayClass
  command: kubectl wait --for=condition=Accepted gatewayclass/lb-small-noeip --timeout=180s