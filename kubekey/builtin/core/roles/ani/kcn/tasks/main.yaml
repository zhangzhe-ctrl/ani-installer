---
- name: ANI KCN | Create work directory
  command: install -d -m 0755 /etc/kubernetes/ani

- name: ANI KCN | Render node preflight
  loop: "{{ .groups.k8s_cluster | default list | toJson }}"
  delegate_to: "{{ .item }}"
  template:
    src: preflight-node.sh
    dest: /etc/kubernetes/ani/kcn-preflight-node.sh

- name: ANI KCN | Verify bootstrap TLS and explicitly requested underlay devices
  loop: "{{ .groups.k8s_cluster | default list | toJson }}"
  delegate_to: "{{ .item }}"
  command: bash /etc/kubernetes/ani/kcn-preflight-node.sh

- name: ANI KCN | Render namespace and all CRDs
  template:
    src: namespace-crds.yaml
    dest: /etc/kubernetes/ani/kcn-namespace-crds.yaml

- name: ANI KCN | Apply namespace and all CRDs before runtime
  command: KUBECONFIG='{{ .ani.run.kubeconfig }}' kubectl apply --server-side -f /etc/kubernetes/ani/kcn-namespace-crds.yaml

- name: ANI KCN | Wait for every supplied CRD Established
  command: |
    set -euo pipefail
    export KUBECONFIG='{{ .ani.run.kubeconfig }}'
    kubectl get -f /etc/kubernetes/ani/kcn-namespace-crds.yaml -o name |
      while IFS= read -r resource; do
        case "$resource" in customresourcedefinition.*/*)
          kubectl wait --for=condition=Established "$resource" --timeout=180s ;;
        esac
      done

- name: ANI KCN | Render complete site configuration, RBAC and runtime
  template:
    src: install.yaml
    dest: /etc/kubernetes/ani/kcn-install.yaml

- name: ANI KCN | Persist OVN reverse path filtering
  loop: "{{ .groups.k8s_cluster | default list | toJson }}"
  delegate_to: "{{ .item }}"
  command: >-
    sh -c 'printf "%s\n" "net.ipv4.conf.default.rp_filter=0" > /etc/sysctl.d/99-ani-kcn.conf
    && sysctl -w net.ipv4.conf.default.rp_filter=0'

- name: ANI KCN | Apply complete runtime after API establishment
  command: KUBECONFIG='{{ .ani.run.kubeconfig }}' kubectl apply --server-side -f /etc/kubernetes/ani/kcn-install.yaml

- name: ANI KCN | Wait for controller deployment
  command: KUBECONFIG='{{ .ani.run.kubeconfig }}' kubectl rollout status deployment/kcn-controller -n kcn-system --timeout=600s

- name: ANI KCN | Wait for OVN central deployment
  command: KUBECONFIG='{{ .ani.run.kubeconfig }}' kubectl rollout status deployment/kcn-ovn-central -n kcn-system --timeout=600s

- name: ANI KCN | Wait for CNI daemonset
  command: KUBECONFIG='{{ .ani.run.kubeconfig }}' kubectl rollout status daemonset/kcn-cni-ds -n kcn-system --timeout=600s

- name: ANI KCN | Wait for OVS daemonset
  command: KUBECONFIG='{{ .ani.run.kubeconfig }}' kubectl rollout status daemonset/kcn-ovs-ds -n kcn-system --timeout=600s

- name: ANI KCN | Wait for each node's primary conflist before Multus
  loop: "{{ .groups.k8s_cluster | default list | toJson }}"
  delegate_to: "{{ .item }}"
  command: |
    set -euo pipefail
    for attempt in $(seq 1 120); do
      if test -s /etc/cni/net.d/01-kc-networking.conflist; then
        python3 -c 'import json; c=json.load(open("/etc/cni/net.d/01-kc-networking.conflist")); assert c["plugins"][0]["type"] == "kc-networking"'
        exit 0
      fi
      sleep 2
    done
    echo 'KCN primary conflist absent' >&2
    exit 1

- name: ANI KCN | Wait for every node Ready
  command: KUBECONFIG='{{ .ani.run.kubeconfig }}' kubectl wait nodes --all --for=condition=Ready --timeout=600s

- name: ANI KCN | Disable OVN interface reverse path filtering
  loop: "{{ .groups.k8s_cluster | default list | toJson }}"
  delegate_to: "{{ .item }}"
  command: >-
    sh -c 'for i in $(seq 1 30); do test -e /sys/class/net/ovn0 && break; sleep 2; done;
    sysctl -w net.ipv4.conf.ovn0.rp_filter=0'
