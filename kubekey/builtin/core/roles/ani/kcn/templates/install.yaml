  labels:
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
spec:
  ports:
  - name: ovn-nb
    port: 6641
    protocol: TCP
    targetPort: 6641
  selector:
    networking.kubercloud.com/app: ovn-central
    ovn-nb-leader: 'true'
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
