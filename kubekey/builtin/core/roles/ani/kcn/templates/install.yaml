apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    networking.kubercloud.com/app: controller
  name: kcn-controller
  namespace: kcn-system
spec:
  replicas: 3
  selector:
    matchLabels:
      networking.kubercloud.com/app: controller
  strategy:
    rollingUpdate:
      maxSurge: 0%
      maxUnavailable: 100%
    type: RollingUpdate
  template:
    metadata:
      labels:
        networking.kubercloud.com/app: controller
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                networking.kubercloud.com/app: controller
            topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: true
      containers:
      - args:
        - --service-cluster-ip-range={{ .ani.network.service_cidr }}
        command:
        - /kc-networking/start-controller.sh
        env:
        - name: OVN_DB_IPS
          value: {{ .ani.node_addresses | join "," }}
        - name: ENABLE_SSL
          value: "false"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: POD_IPS
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIPs
        # imagePullPolicy 偏离上游 Always：离线环境镜像经节点本地 registry 分发，
        # IfNotPresent 避免每次 pod 启动都打 registry（上游 dev 清单 5 处 Always
        # 统一改回 IfNotPresent，含 install-cni init 容器；决策点 1，2026-09-20 升级计划）。
        image: {{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking:dev" }}
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 18081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: kcn-controller
        ports:
        - containerPort: 18081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 18081
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            ephemeral-storage: 1Gi
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 200Mi
        securityContext:
          capabilities:
            add:
            - NET_BIND_SERVICE
            - NET_RAW
          privileged: false
          runAsUser: 65534
        volumeMounts:
        - mountPath: /etc/localtime
          name: localtime
          readOnly: true
        - mountPath: /var/log/kc-networking
          name: kc-networking-log
        - mountPath: /var/log/ovn
          name: ovn-log
        - mountPath: /var/run/tls
          name: kc-networking-tls
      hostNetwork: true
      initContainers:
      - command:
        - sh
        - -c
        - 'chown -R nobody: /var/log/kc-networking'
        image: {{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking:dev" }}
        imagePullPolicy: IfNotPresent
        name: hostpath-init
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            drop:
            - ALL
          privileged: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/log/kc-networking
          name: kc-networking-log
      nodeSelector:
        kubernetes.io/os: linux
        networking.kubercloud.com/role: master
      priorityClassName: system-cluster-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kcn-controller
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists
      volumes:
      - hostPath:
          path: /etc/localtime
        name: localtime
      - hostPath:
          path: /var/log/kc-networking
        name: kc-networking-log
      - hostPath:
          path: /var/log/ovn
        name: ovn-log
      - name: kc-networking-tls
        secret:
          optional: true
          secretName: kc-networking-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    networking.kubercloud.com/app: ovn-central
  name: kcn-ovn-central
  namespace: kcn-system
spec:
  replicas: 3
  selector:
    matchLabels:
      networking.kubercloud.com/app: ovn-central
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        component: network
        networking.kubercloud.com/app: ovn-central
        type: infra
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                networking.kubercloud.com/app: ovn-central
            topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: true
      containers:
      - command:
        - bash
        - /kc-networking/start-db.sh
        env:
        - name: NODE_IPS
          value: {{ .ani.node_addresses | join "," }}
        - name: ENABLE_SSL
          value: "false"
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: POD_IPS
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIPs
        - name: ENABLE_BIND_LOCAL_IP
          value: "true"
        - name: DEBUG_WRAPPER
        - name: PROBE_INTERVAL
          value: "180000"
        - name: OVN_NORTHD_PROBE_INTERVAL
          value: "5000"
        - name: OVN_LEADER_PROBE_INTERVAL
          value: "5"
        - name: OVN_NORTHD_N_THREADS
          value: "1"
        - name: ENABLE_COMPACT
          value: "false"
        image: {{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking:dev" }}
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - bash
            - /kc-networking/ovn-healthcheck.sh
          failureThreshold: 5
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 45
        name: ovn-central
        readinessProbe:
          exec:
            command:
            - bash
            - /kc-networking/ovn-healthcheck.sh
          periodSeconds: 15
          timeoutSeconds: 45
        resources:
          limits:
            cpu: "4"
            ephemeral-storage: 1Gi
            memory: 4Gi
          requests:
            cpu: 300m
            memory: 300Mi
        securityContext:
          capabilities:
            add:
            - NET_BIND_SERVICE
            - SYS_NICE
          privileged: false
          runAsUser: 65534
        volumeMounts:
        - mountPath: /var/run/ovn
          name: host-run-ovn
        - mountPath: /etc/ovn
          name: host-config-ovn
        - mountPath: /var/log/ovn
          name: host-log-ovn
        - mountPath: /etc/localtime
          name: localtime
          readOnly: true
        - mountPath: /var/run/tls
          name: kc-networking-tls
      hostNetwork: true
      initContainers:
      - command:
        - sh
        - -c
        - 'chown -R nobody: /var/run/ovn /etc/ovn /var/log/ovn'
        image: {{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking:dev" }}
        imagePullPolicy: IfNotPresent
        name: hostpath-init
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            drop:
            - ALL
          privileged: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/run/ovn
          name: host-run-ovn
        - mountPath: /etc/ovn
          name: host-config-ovn
        - mountPath: /var/log/ovn
          name: host-log-ovn
      nodeSelector:
        kubernetes.io/os: linux
        networking.kubercloud.com/role: master
      priorityClassName: system-cluster-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kcn-controller
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists
      volumes:
      - hostPath:
          path: /run/ovn
        name: host-run-ovn
      - hostPath:
          path: /etc/origin/ovn
        name: host-config-ovn
      - hostPath:
          path: /var/log/ovn
        name: host-log-ovn
      - hostPath:
          path: /etc/localtime
        name: localtime
      - name: kc-networking-tls
        secret:
          optional: true
          secretName: kc-networking-tls
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    networking.kubercloud.com/app: cni-ds
  name: kcn-cni-ds
  namespace: kcn-system
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      networking.kubercloud.com/app: cni-ds
  template:
    metadata:
      labels:
        networking.kubercloud.com/app: cni-ds
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - --service-cluster-ip-range={{ .ani.network.service_cidr }}
        command:
        - /kc-networking/start-cniserver.sh
        env:
        - name: ENABLE_SSL
          value: "false"
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: POD_IPS
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIPs
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        image: {{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking:dev" }}
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 18082
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: kcn-cni-server
        ports:
        - containerPort: 18082
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 18082
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            ephemeral-storage: 1Gi
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 100Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_BIND_SERVICE
            - NET_RAW
            - SYS_ADMIN
            - SYS_NICE
            - SYS_PTRACE
          privileged: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /etc/cni/net.d
          name: cni-conf
        - mountPath: /usr/local/sbin
          name: usr-local-sbin
        - mountPath: /lib/modules
          name: host-modules
          readOnly: true
        - mountPath: /run/xtables.lock
          name: xtables-lock
        - mountPath: /var/lib/kubelet/pods
          name: shared-dir
        - mountPath: /etc/openvswitch
          name: systemid
          readOnly: true
        - mountPath: /etc/ovs_ipsec_keys
          name: ovs-ipsec-keys
        - mountPath: /run/openvswitch
          mountPropagation: HostToContainer
          name: host-run-ovs
        - mountPath: /run/ovn
          name: host-run-ovn
        - mountPath: /host/var/run/dbus
          mountPropagation: HostToContainer
          name: host-dbus
        - mountPath: /var/run/netns
          mountPropagation: HostToContainer
          name: host-ns
        - mountPath: /var/lib/cni/kc-networking
          name: host-lib-cni
        - mountPath: /var/log/kc-networking
          name: kc-networking-log
        - mountPath: /var/log/openvswitch
          name: host-log-ovs
        - mountPath: /var/log/ovn
          name: host-log-ovn
        - mountPath: /etc/localtime
          name: localtime
          readOnly: true
      hostNetwork: true
      hostPID: true
      initContainers:
      - command:
        - /kc-networking/install-cni.sh
        env:
        - name: POD_IPS
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIPs
        image: {{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking:dev" }}
        imagePullPolicy: IfNotPresent
        name: install-cni
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /opt/cni/bin
          name: cni-bin
        - mountPath: /usr/local/bin
          name: local-bin
      - command:
        - sh
        - -xec
        - |
          chmod +t /usr/local/sbin
          iptables -V
          chown -R nobody: /var/log/kc-networking
        image: {{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking:dev" }}
        imagePullPolicy: IfNotPresent
        name: hostpath-init
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            drop:
            - ALL
          privileged: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /usr/local/sbin
          name: usr-local-sbin
        - mountPath: /run/xtables.lock
          name: xtables-lock
        - mountPath: /var/run/netns
          name: host-ns
        - mountPath: /var/log/kc-networking
          name: kc-networking-log
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kcn-controller
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists
      volumes:
      - emptyDir: {}
        name: usr-local-sbin
      - hostPath:
          path: /lib/modules
        name: host-modules
      - hostPath:
          path: /run/xtables.lock
          type: FileOrCreate
        name: xtables-lock
      - hostPath:
          path: /var/lib/kubelet/pods
        name: shared-dir
      - hostPath:
          path: /etc/origin/openvswitch
        name: systemid
      - hostPath:
          path: /etc/origin/ovs_ipsec_keys
        name: ovs-ipsec-keys
      - hostPath:
          path: /run/openvswitch
        name: host-run-ovs
      - hostPath:
          path: /run/ovn
        name: host-run-ovn
      - hostPath:
          path: /etc/cni/net.d
        name: cni-conf
      - hostPath:
          path: /opt/cni/bin
        name: cni-bin
      - hostPath:
          path: /var/run/netns
        name: host-ns
      - hostPath:
          path: /var/run/dbus
        name: host-dbus
      - hostPath:
          path: /var/lib/cni/kc-networking
        name: host-lib-cni
      - hostPath:
          path: /var/log/openvswitch
        name: host-log-ovs
      - hostPath:
          path: /var/log/ovn
        name: host-log-ovn
      - hostPath:
          path: /var/log/kc-networking
        name: kc-networking-log
      - hostPath:
          path: /etc/localtime
        name: localtime
      - hostPath:
          path: /usr/local/bin
        name: local-bin
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    networking.kubercloud.com/app: ovs-ds
  name: kcn-ovs-ds
  namespace: kcn-system
spec:
  selector:
    matchLabels:
      networking.kubercloud.com/app: ovs-ds
  template:
    metadata:
      labels:
        component: network
        networking.kubercloud.com/app: ovs-ds
        type: infra
    spec:
      automountServiceAccountToken: true
      containers:
      - command:
        - /kc-networking/start-ovs.sh
        env:
        - name: OVN_DB_IPS
          value: {{ .ani.node_addresses | join "," }}
        - name: ENABLE_SSL
          value: "false"
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: HW_OFFLOAD
          value: "false"
        - name: TUNNEL_TYPE
          value: geneve
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: DEBUG_WRAPPER
        - name: OVN_REMOTE_PROBE_INTERVAL
          value: "10000"
        - name: OVN_REMOTE_OPENFLOW_INTERVAL
          value: "180"
        image: {{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking:dev" }}
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - bash
            - /kc-networking/ovs-healthcheck.sh
          failureThreshold: 5
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 45
        name: openvswitch
        readinessProbe:
          exec:
            command:
            - bash
            - /kc-networking/ovs-healthcheck.sh
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 45
        resources:
          limits:
            cpu: "2"
            ephemeral-storage: 1Gi
            memory: 1000Mi
          requests:
            cpu: 200m
            memory: 200Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_BIND_SERVICE
            - NET_RAW
            - SYS_NICE
            - SYS_ADMIN
          privileged: false
          runAsUser: 65534
        volumeMounts:
        - mountPath: /usr/local/sbin
          name: usr-local-sbin
        - mountPath: /lib/modules
          name: host-modules
          readOnly: true
        - mountPath: /var/run/openvswitch
          name: host-run-ovs
        - mountPath: /var/run/ovn
          name: host-run-ovn
        - mountPath: /etc/openvswitch
          name: host-config-openvswitch
        - mountPath: /var/log/openvswitch
          name: host-log-ovs
        - mountPath: /var/log/ovn
          name: host-log-ovn
        - mountPath: /etc/localtime
          name: localtime
          readOnly: true
        - mountPath: /var/run/tls
          name: kc-networking-tls
        - mountPath: /var/run/containerd
          name: cruntime
          readOnly: true
      hostNetwork: true
      hostPID: true
      initContainers:
      - command:
        - sh
        - -xec
        - |
          chmod +t /usr/local/sbin
          chown -R nobody: /var/run/ovn /var/log/ovn /etc/openvswitch /var/run/openvswitch /var/log/openvswitch
          iptables -V
          /usr/share/openvswitch/scripts/ovs-ctl load-kmod
        image: {{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking:dev" }}
        imagePullPolicy: IfNotPresent
        name: hostpath-init
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            drop:
            - ALL
          privileged: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /lib/modules
          name: host-modules
          readOnly: true
        - mountPath: /usr/local/sbin
          name: usr-local-sbin
        - mountPath: /var/log/ovn
          name: host-log-ovn
        - mountPath: /var/run/ovn
          name: host-run-ovn
        - mountPath: /etc/openvswitch
          name: host-config-openvswitch
        - mountPath: /var/run/openvswitch
          name: host-run-ovs
        - mountPath: /var/log/openvswitch
          name: host-log-ovs
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kcn-controller
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists
      volumes:
      - emptyDir: {}
        name: usr-local-sbin
      - hostPath:
          path: /lib/modules
        name: host-modules
      - hostPath:
          path: /run/openvswitch
        name: host-run-ovs
      - hostPath:
          path: /run/ovn
        name: host-run-ovn
      - hostPath:
          path: /etc/origin/openvswitch
        name: host-config-openvswitch
      - hostPath:
          path: /var/log/openvswitch
        name: host-log-ovs
      - hostPath:
          path: /var/log/ovn
        name: host-log-ovn
      - hostPath:
          path: /etc/localtime
        name: localtime
      - hostPath:
          path: /var/run/containerd
        name: cruntime
      - name: kc-networking-tls
        secret:
          optional: true
          secretName: kc-networking-tls
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
