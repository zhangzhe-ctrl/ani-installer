                description: default indicates whether this is the default VPC. Only
                  one default VPC exists globally.
                type: boolean
              eips:
                additionalProperties:
                  type: string
                description: |-
                  eips maps the EIPs associated with this VPC. Key is the EIP name in
                  "namespace/name" format, value is the EIP address.
                type: object
              observedGeneration:
                description: observedGeneration is the generation of the spec that
                  has been reconciled.
                format: int64
                type: integer
              subnets:
                additionalProperties:
                  type: string
                description: |-
                  subnets lists the subnets attached to this VPC. Key is the subnet name
                  in "namespace/name" format, value is the subnet cidr.
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
