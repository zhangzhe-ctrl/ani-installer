            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of EIPGateway
            properties:
              egressType:
                default: Host
                description: 'egressType specifies the overlay egress method. Supported
                  values: Host, Gateway. Defaults to Host. Currently only Host is
                  supported.'
                enum:
                - Host
                type: string
              gatewayConfig:
                description: |-
                  gatewayConfig is required when egressType is "Gateway".
                  NOTE: This is not currently implemented.
                properties:
                  network:
                    description: network defines the network used for interconnection
                      with the switch.
                    properties:
                      localIP:
                        description: localIP is the OVN-side interconnection address
                          (e.g. "100.64.0.1/30").
                        pattern: ^(?:(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?|0)\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?|0)/(?:3[0-2]|[12]?[0-9]))$
                        type: string
                      vlanNetwork:
                        description: vlanNetwork is the VLAN network used for interconnection
                          with the switch.
                        type: string
                    required:
                    - localIP
                    - vlanNetwork
                    type: object
                  nodes:
                    additionalProperties:
                      format: int32
                      type: integer
                    description: |-
                      nodes lists the gateway nodes in active-backup mode.
                      Key is the node name, value is the priority (higher value means higher priority).
                    type: object
                  routes:
                    description: routes lists the static routes for the gateway.
                    items:
                      description: RouteEntry defines a single route in the route
                        table.
                      properties:
                        cidr:
                          description: cidr is the target/source CIDR depending on
                            the policy.
                          pattern: ^(?:(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?|0)\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?|0)/(?:3[0-2]|[12]?[0-9]))$
                          type: string
                        enableECMP:
                          description: enableECMP indicates whether this route uses
                            equal-cost multi-path routing.
                          type: boolean
                        externalID:
                          description: |-
                            externalID is an optional identifier set by upper-layer applications for
                            correlation and tracing purposes.
                          type: string
                        nextHopIP:
                          description: nextHopIP is the next hop IP address. It is
                            required when nextHopType is IPAddr.
                          pattern: ^(?:(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?|0)\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?|0))$
                          type: string
                        nextHopResource:
                          description: |-
                            nextHopResource is the VPCAttachment resource in namespace/name format.
                            It is required when nextHopType is VPCAttachment.
                          type: string
                        nextHopType:
                          default: IPAddr
                          description: 'nextHopType specifies the next hop type: IPAddr,
                            Discard or VPCAttachment.'
                          enum:
                          - IPAddr
                          - Discard
                          - VPCAttachment
                          type: string
                        policy:
                          default: DstIP
                          description: |-
                            policy specifies the route policy: SrcIP or DstIP.
                            Defaults to DstIP.
                          enum:
                          - SrcIP
                          - DstIP
                          type: string
                      required:
                      - cidr
                      type: object
                    maxItems: 20
                    type: array
                required:
                - network
                - nodes
                type: object
              hostConfig:
                description: hostConfig is required when egressType is "Host".
                properties:
                  localIP:
                    description: localIP is the lrp ip address of service subnet.
                    pattern: ^(?:(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?|0)\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]?|0))$
                    type: string
                required:
                - localIP
                type: object
              scope:
                default: Public
                description: |-
                  scope indicates the EIP network type. Supported values: Intranet, Public.
                  Defaults to Public. Currently only Public is supported. Immutable after creation.
                enum:
                - Public
                type: string
                x-kubernetes-validations:
                - message: field is immutable
                  rule: self == oldSelf
            type: object
            x-kubernetes-validations:
            - message: field scope is immutable once set
              rule: '!has(oldSelf.scope) || has(self.scope)'
          status:
            description: status defines the observed state of EIPGateway
            properties:
              boundResources:
                description: boundResources holds OVN-related resource IDs for the
                  EIPGateway.
                properties:
                  router:
                    description: router is the OVN logical router name.
                    type: string
                required:
                - router
                type: object
              conditions:
                description: |-
                  conditions represent the current state of the EIPGateway resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Condition types include:
                  - "Valid": the spec parameters are valid
                  - "Initialized": the EIPGateway has been validated and is ready to be applied
                  - "Ready": the EIPGateway is ready for use

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
