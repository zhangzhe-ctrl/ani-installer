---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    networking.kubercloud.com/app: controller
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
  name: kcn-controller
  namespace: kcn-system
spec:
  replicas: 3
  selector:
    matchLabels:
      networking.kubercloud.com/app: controller
  strategy:
    rollingUpdate:
      maxSurge: 0%
      maxUnavailable: 100%
    type: RollingUpdate
  template:
    metadata:
      labels:
        networking.kubercloud.com/app: controller
      annotations:
        ani.io/config-checksum: '{{ .ani.network.kcn.configChecksum }}'
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                networking.kubercloud.com/app: controller
            topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: true
      containers:
      - args:
        - --service-cluster-ip-range={{ .ani.network.service_cidr }}
        - --default-cidr={{ .ani.network.pod_cidr }}
        command:
        - /kc-networking/start-controller.sh
        env:
        - name: OVN_DB_IPS
          value: '{{ join "," .ani.node_addresses }}'
        - name: ENABLE_SSL
          value: 'false'
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: POD_IPS
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIPs
        - name: KUBERNETES_SERVICE_HOST
          value: '{{ .ani.network.bootstrap_address }}'
        - name: KUBERNETES_SERVICE_PORT
          value: '6443'
        image: '{{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking@sha256:494432d2f7b896eb953647166c6aa18d6ea2113b133d40d82127cfcbe416712f"
          }}'
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 18081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: kcn-controller
        ports:
        - containerPort: 18081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 18081
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '1'
            ephemeral-storage: 1Gi
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 200Mi
        securityContext:
          capabilities:
            add:
            - NET_BIND_SERVICE
            - NET_RAW
          privileged: false
          runAsUser: 65534
        volumeMounts:
        - mountPath: /etc/localtime
          name: localtime
          readOnly: true
        - mountPath: /var/log/kc-networking
          name: kc-networking-log
        - mountPath: /var/log/ovn
          name: ovn-log
        - mountPath: /var/run/tls
          name: kc-networking-tls
      hostNetwork: true
      initContainers:
      - command:
        - sh
        - -c
        - 'chown -R nobody: /var/log/kc-networking'
        image: '{{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking@sha256:494432d2f7b896eb953647166c6aa18d6ea2113b133d40d82127cfcbe416712f"
          }}'
        imagePullPolicy: IfNotPresent
        name: hostpath-init
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            drop:
            - ALL
          privileged: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/log/kc-networking
          name: kc-networking-log
      nodeSelector:
        kubernetes.io/os: linux
        networking.kubercloud.com/role: master
      priorityClassName: system-cluster-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kcn-controller
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists
      volumes:
      - hostPath:
          path: /etc/localtime
        name: localtime
      - hostPath:
          path: /var/log/kc-networking
        name: kc-networking-log
      - hostPath:
          path: /var/log/ovn
        name: ovn-log
      - name: kc-networking-tls
        secret:
          optional: true
          secretName: kc-networking-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    networking.kubercloud.com/app: ovn-central
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
  name: kcn-ovn-central
  namespace: kcn-system
spec:
  replicas: 3
  selector:
    matchLabels:
      networking.kubercloud.com/app: ovn-central
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        component: network
        networking.kubercloud.com/app: ovn-central
        type: infra
      annotations:
        ani.io/config-checksum: '{{ .ani.network.kcn.configChecksum }}'
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                networking.kubercloud.com/app: ovn-central
            topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: true
      containers:
      - command:
        - bash
        - /kc-networking/start-db.sh
        env:
        - name: NODE_IPS
          value: '{{ join "," .ani.node_addresses }}'
        - name: ENABLE_SSL
          value: 'false'
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: POD_IPS
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIPs
        - name: ENABLE_BIND_LOCAL_IP
          value: 'true'
        - name: DEBUG_WRAPPER
        - name: PROBE_INTERVAL
          value: '180000'
        - name: OVN_NORTHD_PROBE_INTERVAL
          value: '5000'
        - name: OVN_LEADER_PROBE_INTERVAL
          value: '5'
        - name: OVN_NORTHD_N_THREADS
          value: '1'
        - name: ENABLE_COMPACT
          value: 'false'
        - name: KUBERNETES_SERVICE_HOST
          value: '{{ .ani.network.bootstrap_address }}'
        - name: KUBERNETES_SERVICE_PORT
          value: '6443'
        image: '{{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking@sha256:494432d2f7b896eb953647166c6aa18d6ea2113b133d40d82127cfcbe416712f"
          }}'
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - bash
            - /kc-networking/ovn-healthcheck.sh
          failureThreshold: 5
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 45
        name: ovn-central
        readinessProbe:
          exec:
            command:
            - bash
            - /kc-networking/ovn-healthcheck.sh
          periodSeconds: 15
          timeoutSeconds: 45
        resources:
          limits:
            cpu: '4'
            ephemeral-storage: 1Gi
            memory: 4Gi
          requests:
            cpu: 300m
            memory: 300Mi
        securityContext:
          capabilities:
            add:
            - NET_BIND_SERVICE
            - SYS_NICE
          privileged: false
          runAsUser: 65534
        volumeMounts:
        - mountPath: /var/run/ovn
          name: host-run-ovn
        - mountPath: /etc/ovn
          name: host-config-ovn
        - mountPath: /var/log/ovn
          name: host-log-ovn
        - mountPath: /etc/localtime
          name: localtime
          readOnly: true
        - mountPath: /var/run/tls
          name: kc-networking-tls
      hostNetwork: true
      initContainers:
      - command:
        - sh
        - -c
        - 'chown -R nobody: /var/run/ovn /etc/ovn /var/log/ovn'
        image: '{{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking@sha256:494432d2f7b896eb953647166c6aa18d6ea2113b133d40d82127cfcbe416712f"
          }}'
        imagePullPolicy: IfNotPresent
        name: hostpath-init
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            drop:
            - ALL
          privileged: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/run/ovn
          name: host-run-ovn
        - mountPath: /etc/ovn
          name: host-config-ovn
        - mountPath: /var/log/ovn
          name: host-log-ovn
      nodeSelector:
        kubernetes.io/os: linux
        networking.kubercloud.com/role: master
      priorityClassName: system-cluster-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kcn-controller
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists
      volumes:
      - hostPath:
          path: /run/ovn
        name: host-run-ovn
      - hostPath:
          path: /etc/origin/ovn
        name: host-config-ovn
      - hostPath:
          path: /var/log/ovn
        name: host-log-ovn
      - hostPath:
          path: /etc/localtime
        name: localtime
      - name: kc-networking-tls
        secret:
          optional: true
          secretName: kc-networking-tls
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    networking.kubercloud.com/app: cni-ds
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
  name: kcn-cni-ds
  namespace: kcn-system
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      networking.kubercloud.com/app: cni-ds
  template:
    metadata:
      labels:
        networking.kubercloud.com/app: cni-ds
      annotations:
        ani.io/config-checksum: '{{ .ani.network.kcn.configChecksum }}'
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - --service-cluster-ip-range={{ .ani.network.service_cidr }}
        command:
        - /kc-networking/start-cniserver.sh
        env:
        - name: ENABLE_SSL
          value: 'false'
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: POD_IPS
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIPs
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: KUBERNETES_SERVICE_HOST
          value: '{{ .ani.network.bootstrap_address }}'
        - name: KUBERNETES_SERVICE_PORT
          value: '6443'
        image: '{{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking@sha256:494432d2f7b896eb953647166c6aa18d6ea2113b133d40d82127cfcbe416712f"
          }}'
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 18082
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: kcn-cni-server
        ports:
        - containerPort: 18082
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 18082
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '1'
            ephemeral-storage: 1Gi
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 100Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_BIND_SERVICE
            - NET_RAW
            - SYS_ADMIN
            - SYS_NICE
            - SYS_PTRACE
          privileged: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /etc/cni/net.d
          name: cni-conf
        - mountPath: /usr/local/sbin
          name: usr-local-sbin
        - mountPath: /lib/modules
          name: host-modules
          readOnly: true
        - mountPath: /run/xtables.lock
          name: xtables-lock
        - mountPath: /var/lib/kubelet/pods
          name: shared-dir
        - mountPath: /etc/openvswitch
          name: systemid
          readOnly: true
        - mountPath: /etc/ovs_ipsec_keys
          name: ovs-ipsec-keys
        - mountPath: /run/openvswitch
          mountPropagation: HostToContainer
          name: host-run-ovs
        - mountPath: /run/ovn
          name: host-run-ovn
        - mountPath: /host/var/run/dbus
          mountPropagation: HostToContainer
          name: host-dbus
        - mountPath: /var/run/netns
          mountPropagation: HostToContainer
          name: host-ns
        - mountPath: /var/lib/cni/kc-networking
          name: host-lib-cni
        - mountPath: /var/log/kc-networking
          name: kc-networking-log
        - mountPath: /var/log/openvswitch
          name: host-log-ovs
        - mountPath: /var/log/ovn
          name: host-log-ovn
        - mountPath: /etc/localtime
          name: localtime
          readOnly: true
      hostNetwork: true
      hostPID: true
      initContainers:
      - command:
        - /kc-networking/install-cni.sh
        env:
        - name: POD_IPS
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIPs
        image: '{{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking@sha256:494432d2f7b896eb953647166c6aa18d6ea2113b133d40d82127cfcbe416712f"
          }}'
        imagePullPolicy: IfNotPresent
        name: install-cni
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /opt/cni/bin
          name: cni-bin
        - mountPath: /usr/local/bin
          name: local-bin
      - command:
        - sh
        - -xec
