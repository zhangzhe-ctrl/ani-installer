---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    networking.kubercloud.com/app: ovs-ds
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
  name: kcn-ovs-ds
  namespace: kcn-system
spec:
  selector:
    matchLabels:
      networking.kubercloud.com/app: ovs-ds
  template:
    metadata:
      labels:
        component: network
        networking.kubercloud.com/app: ovs-ds
        type: infra
      annotations:
        ani.io/config-checksum: '{{ .ani.network.kcn.configChecksum }}'
    spec:
      automountServiceAccountToken: true
      containers:
      - command:
        - /kc-networking/start-ovs.sh
        env:
        - name: OVN_DB_IPS
          value: '{{ join "," .ani.node_addresses }}'
        - name: ENABLE_SSL
          value: 'false'
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: HW_OFFLOAD
          value: 'false'
        - name: TUNNEL_TYPE
          value: geneve
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: DEBUG_WRAPPER
        - name: OVN_REMOTE_PROBE_INTERVAL
          value: '10000'
        - name: OVN_REMOTE_OPENFLOW_INTERVAL
          value: '180'
        - name: KUBERNETES_SERVICE_HOST
          value: '{{ .ani.network.bootstrap_address }}'
        - name: KUBERNETES_SERVICE_PORT
          value: '6443'
        image: '{{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking@sha256:494432d2f7b896eb953647166c6aa18d6ea2113b133d40d82127cfcbe416712f"
          }}'
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - bash
            - /kc-networking/ovs-healthcheck.sh
          failureThreshold: 5
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 45
        name: openvswitch
        readinessProbe:
          exec:
            command:
            - bash
            - /kc-networking/ovs-healthcheck.sh
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 45
        resources:
          limits:
            cpu: '2'
            ephemeral-storage: 1Gi
            memory: 1000Mi
          requests:
            cpu: 200m
            memory: 200Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_BIND_SERVICE
            - NET_RAW
            - SYS_NICE
            - SYS_ADMIN
          privileged: false
          runAsUser: 65534
        volumeMounts:
        - mountPath: /usr/local/sbin
          name: usr-local-sbin
        - mountPath: /lib/modules
          name: host-modules
          readOnly: true
        - mountPath: /var/run/openvswitch
          name: host-run-ovs
        - mountPath: /var/run/ovn
          name: host-run-ovn
        - mountPath: /etc/openvswitch
          name: host-config-openvswitch
        - mountPath: /var/log/openvswitch
          name: host-log-ovs
        - mountPath: /var/log/ovn
          name: host-log-ovn
        - mountPath: /etc/localtime
          name: localtime
          readOnly: true
        - mountPath: /var/run/tls
          name: kc-networking-tls
        - mountPath: /var/run/containerd
          name: cruntime
          readOnly: true
      hostNetwork: true
      hostPID: true
      initContainers:
      - command:
        - sh
        - -xec
        - 'chmod +t /usr/local/sbin

          chown -R nobody: /var/run/ovn /var/log/ovn /etc/openvswitch /var/run/openvswitch
          /var/log/openvswitch

          iptables -V

          /usr/share/openvswitch/scripts/ovs-ctl load-kmod

          '
        image: '{{ index .ani.images "docker.changqingyun.cn/kubercloud/kc-networking@sha256:494432d2f7b896eb953647166c6aa18d6ea2113b133d40d82127cfcbe416712f"
          }}'
        imagePullPolicy: IfNotPresent
        name: hostpath-init
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            drop:
            - ALL
          privileged: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /lib/modules
          name: host-modules
          readOnly: true
        - mountPath: /usr/local/sbin
          name: usr-local-sbin
        - mountPath: /var/log/ovn
          name: host-log-ovn
        - mountPath: /var/run/ovn
          name: host-run-ovn
        - mountPath: /etc/openvswitch
          name: host-config-openvswitch
        - mountPath: /var/run/openvswitch
          name: host-run-ovs
        - mountPath: /var/log/openvswitch
          name: host-log-ovs
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kcn-controller
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists
      volumes:
      - emptyDir: {}
        name: usr-local-sbin
      - hostPath:
          path: /lib/modules
        name: host-modules
      - hostPath:
          path: /run/openvswitch
        name: host-run-ovs
      - hostPath:
          path: /run/ovn
        name: host-run-ovn
      - hostPath:
          path: /etc/origin/openvswitch
        name: host-config-openvswitch
      - hostPath:
          path: /var/log/openvswitch
        name: host-log-ovs
      - hostPath:
          path: /var/log/ovn
        name: host-log-ovn
      - hostPath:
          path: /etc/localtime
        name: localtime
      - hostPath:
          path: /var/run/containerd
        name: cruntime
      - name: kc-networking-tls
        secret:
          optional: true
          secretName: kc-networking-tls
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
