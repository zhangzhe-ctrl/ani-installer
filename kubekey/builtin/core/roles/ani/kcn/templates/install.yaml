apiVersion: v1
data:
  enablePortSecurity: 'false'
  encapNetworks: '{{ join "," .ani.network.kcn.encapNetworks }}'
  hasMultusCNI: '{{ .ani.network.multus.enabled }}'
  intranetNetworks: |
{{- range .ani.network.kcn.intranetNetworks }}
    - {{ . }}
{{- end }}
  isDefaultCNI: 'true'
  managedDevices: '{{ join "," .ani.network.kcn.managedDevices }}'
  nadDefaultNamespace: kube-system
  securityGroupMaxPortRanges: '10'
  securityGroupMaxRemoteAddresses: '10'
  securityGroupMaxRules: '100'
kind: ConfigMap
metadata:
  name: kcn-config
  namespace: kcn-system
  labels:
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
---
apiVersion: v1
