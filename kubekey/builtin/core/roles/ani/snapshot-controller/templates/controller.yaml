---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ani-snapshot-controller
  namespace: kube-system
  labels:
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ani-snapshot-controller-runner
  labels:
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
rules:
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotcontents
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - delete
  - patch
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotcontents/status
  verbs:
  - patch
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshots
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
  - delete
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshots/status
  verbs:
  - update
  - patch
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ani-snapshot-controller-role
  labels:
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
subjects:
- kind: ServiceAccount
  name: ani-snapshot-controller
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: ani-snapshot-controller-runner
  apiGroup: rbac.authorization.k8s.io
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ani-snapshot-controller-leaderelection
  namespace: kube-system
  labels:
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - watch
  - list
  - delete
  - update
  - create
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ani-snapshot-controller-leaderelection
  namespace: kube-system
  labels:
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
subjects:
- kind: ServiceAccount
  name: ani-snapshot-controller
roleRef:
  kind: Role
  name: ani-snapshot-controller-leaderelection
  apiGroup: rbac.authorization.k8s.io
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: ani-snapshot-controller
  namespace: kube-system
  labels:
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ani-snapshot-controller
  minReadySeconds: 35
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ani-snapshot-controller
    spec:
      serviceAccountName: ani-snapshot-controller
      containers:
      - name: snapshot-controller
        image: '{{ index .ani.images "registry.k8s.io/sig-storage/snapshot-controller:v8.5.0" }}'
        args:
        - --v=5
        - --leader-election=true
        imagePullPolicy: IfNotPresent
