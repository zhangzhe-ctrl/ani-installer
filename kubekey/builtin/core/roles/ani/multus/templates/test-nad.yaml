# This bridge is a node-local functional test only. host-local IPAM is never
# claimed to allocate unique addresses across nodes.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ani-b01-local
  namespace: ani-platform
  labels:
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "ani-b01-local",
      "type": "bridge",
      "bridge": "ani-b01-br",
      "ipam": {"type": "host-local", "subnet": "{{ .ani.network.multus.test_cidr }}"}
    }
