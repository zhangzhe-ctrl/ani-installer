apiVersion: v1
kind: Pod
metadata:
  name: ani-harbor-trivy-seed
  namespace: ani-harbor
  labels:
    app: ani-harbor-trivy-seed
    ani.io/managed-by: '{{ .kubernetes.cluster_name }}'
spec:
  restartPolicy: Never
  containers:
    - name: seed
      image: {{ index .ani.images "docker.io/library/busybox:1.37.0" }}
      command: ["/bin/sh", "-c", "mkdir -p /seed/trivy/db /seed/trivy/java-db; sleep 14400"]
      volumeMounts:
        - {name: data, mountPath: /seed}
      readinessProbe:
        exec: {command: ["/bin/sh", "-c", "test -d /seed/trivy/db"]}
        periodSeconds: 2
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: ani-harbor-trivy-cache}
