# 它不是版本求解器，也不接受任意版本注入。
# 与之配套的执行计划：docs/foundation-components-batch-execution-plan-20260918.md

apiVersion: ani.installer/v1
kind: ComponentMaterialLock

lockedAt: "2026-09-18"
lockBatch: B0
status: materials_confirmed / installation_not_verified

notes:
  - 所有摘要均在 Fedora 上通过 skopeo 实际读取源仓库 manifest 得到，未填假值。
  - source_manifest_digest 是源仓库多架构 index 的摘要；amd64_manifest_digest 是其中
    linux/amd64 manifest 的摘要。二者通常是不同的值，锁定时不得要求相等。
  - 本轮不在目标机联网补依赖；所有部署与测试镜像均来自离线 artifact。
  - Chart 与 app 版本分开记录，不从一个推测另一个。

base:
  # 网络栈二选一（站点配置 network.stack，缺省 kcn）：kcn = 自研批次（kcn CNI +
  # envoy-gateway 家族 + smoke）；kubeovn = Kube-OVN（2026-09-22 材料就位并集成）。
  # kubeovn: v1.16.6 — docker.io 官方镜像（kubeovn/kube-ovn、kubeovn/vpc-nat-gateway，
  # amd64 RepoDigest 见 ani/images-kubeovn.tsv），默认拉取路径直达、无 tar 注入。
  # 清单来自上游 one-step 安装器（v1.16.6 无独立 yaml 下载，heredoc 提取）：
  # https://raw.githubusercontent.com/kubeovn/kube-ovn/refs/tags/v1.16.6/dist/images/install.sh
  # （2026-09-22 实测，sha256 1c556393b4508cabe70bc56c0df107c4c34e67ecf9cafd0f0b086e4f244aeacd）。
  # role ani/kubeovn 清单与等待列表已按真实材料重写；尚未真实安装实证（not_verified）。
  # 现有底座，本轮保留不升级
  kubernetes: v1.35.8
  containerd: v2.3.4
  runc: v1.4.3
  hauler: v2.0.3
  # kcn: dev = docker.changqingyun.cn/kubercloud/kc-networking:dev
  # 2026-09-21 二次供料（fix2，K-5 STS 原地重建修复）：安装清单重写自上游
  # install-dev.yaml（32 段），镜像以本地 tar 注入离线包。amd64 manifest 摘要
  # sha256:05ea46f8cdcb033158cd0c80eac41b88a63eeb87ee4e9f5823be97c94171563a
  #（fix2 tar 为纯 docker-archive 无 index，manifest 为确定性构造，见 /tmp/kcn-tar-report.md）。
  # 2026-09-20 首轮 index sha256:5a8cf98f… 已被本轮取代，见 images.tsv。
  kcn: dev
  # kubeovn 栈（network.stack: kubeovn）固定版本
  kubeovn: v1.16.6
  envoyGateway: 既定定制版本（仓库已锁定，本轮不动）
  rook: v1.20.7
  ceph: v20.2.4

