apiVersion: kubekey.kubesphere.io/v1
kind: Config
spec:
  zone: ""
  download:
    arch: ["amd64"]
    images:
      policy: strict
    kubernetes:
      kube_version: ["v1.35.8"]
    cni:
      type: ["none"]
      multi_cni: ["none"]
    cri:
      container_manager: ["containerd"]
      containerd_version: ["v1.7.13"]
      runc_version: ["v1.1.12"]
    storage_class:
      local:
        enabled: false
      nfs:
        enabled: false
    image_registry:
      type: []
    iso: ["ubuntu-24.04-debs"]

